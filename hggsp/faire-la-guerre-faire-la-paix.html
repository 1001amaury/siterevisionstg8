<title>Faire la guerre, faire la paix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : rail de navigation à gauche, zone de travail centrée ; sur mobile, barre collante + onglets défilants.
   Direction : salle des cartes de nuit. Deux couleurs seulement pour coder le chapitre : brique = guerre, acier = paix. */
:root{
  --bg:#0d0d0d; --bg2:#141414; --panel:#1a1a1a; --panel2:#222222; --line:#2c2c2c; --line2:#3b3b3b;
  --fg:#ededed; --fg2:#bcbcbc; --mute:#888888;
  --war:#bd1026; --war-soft:rgba(189,16,38,.13);
  --peace:#ededed; --peace-soft:rgba(220,220,220,.13);
  --warn:#bdbdbd; --warn-soft:rgba(180,180,180,.1);
  --ok:#ededed; --ok-soft:rgba(220,220,220,.12);
  --ko:#ed5262; --ko-soft:rgba(189,16,38,.12);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--peace);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:700}
h2{font-size:1.45rem}
h3{font-size:1.08rem}
p{margin:0}
.mono,.d{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);padding:26px 18px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--display);font-size:1.12rem;line-height:1.2;font-weight:700}
.brand b em{font-style:normal;color:var(--war)}
.brand b i{font-style:normal;color:var(--peace)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--fg2);font-size:.94rem}
.nav a:hover{background:var(--panel);color:var(--fg)}
.nav a.on{background:var(--panel2);color:var(--fg)}
.nav a small{font-family:var(--mono);font-size:.7rem;color:var(--mute)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.mini{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--fg2);border-radius:4px;transition:width .4s}
main{min-width:0;padding-block:40px 80px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1080px}
.head{display:flex;flex-direction:column;gap:10px}
.head p{color:var(--fg2);max-width:62ch}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:auto;flex-direction:column;gap:10px;padding:12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand{flex-direction:row;align-items:baseline;justify-content:space-between}
  .brand .eyebrow{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 10px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:6px 11px;border:1px solid var(--line);border-radius:20px}
  .nav a small{display:none}
  .rail-foot{display:none}
  main{padding-block:24px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}

/* ---------- éléments communs ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:9px 15px;font-size:.92rem;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--line);border-color:var(--mute)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:20px;padding:5px 12px;font-size:.84rem;color:var(--fg2)}
.chip:hover{color:var(--fg);border-color:var(--mute)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--fg2)}
.tag.war{color:var(--war);border-color:rgba(189,16,38,.45)}
.tag.peace{color:var(--peace);border-color:rgba(220,220,220,.45)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.war{background:var(--war)} .dot.peace{background:var(--peace)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--fg2);transition:width .5s ease}
.bar.war i{background:var(--war)} .bar.peace i{background:var(--peace)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:var(--r)}
input[type=search],input[type=text],textarea,select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--fg2);cursor:pointer;user-select:none}
.check input{accent-color:var(--ok);width:16px;height:16px}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding-bottom:26px;border-bottom:1px solid var(--line)}
.hero h1 span.w{color:var(--war)} .hero h1 span.p{color:var(--peace)}
.hero p{color:var(--fg2);max-width:52ch;margin-top:12px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.ring .v small{font-size:.72rem;color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none}
.stat:hover{border-color:var(--line2)}
.stat .n{font-family:var(--display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--fg2)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.part{display:flex;flex-direction:column;gap:12px}
.part-h{display:flex;align-items:baseline;gap:10px}
.part-h .roman{font-family:var(--display);font-weight:700;font-size:1.6rem}
.part.war .roman{color:var(--war)} .part.peace .roman{color:var(--peace)}
.vid{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;transition:border-color .15s,transform .15s}
.vid:hover{border-color:var(--line2);transform:translateY(-1px)}
.vid .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vid h3{font-size:1rem;line-height:1.3}
.vid .meta{font-size:.8rem;color:var(--mute);font-variant-numeric:tabular-nums}
.todo{display:flex;flex-direction:column}
.todo a,.todo div.it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;font-size:.93rem}
.todo a:last-child{border-bottom:0}
.todo a:hover span:first-child{color:var(--fg)}
.todo span:first-child{color:var(--fg2);min-width:0}
.todo .cnt{font-family:var(--mono);font-size:.78rem;color:var(--mute);flex:none}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.space{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;background:var(--bg2)}
.space:hover{background:var(--panel)}
.space b{font-family:var(--display);font-size:1.02rem;font-weight:600}
.space span{font-size:.84rem;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .parts,.grid2{grid-template-columns:1fr}
  .spaces{grid-template-columns:1fr 1fr}
}

/* ---------- cours ---------- */
.vtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vtab{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;text-align:left;transition:border-color .15s}
.vtab:hover{border-color:var(--line2)}
.vtab .k{font-family:var(--mono);font-size:.7rem;color:var(--mute);letter-spacing:.08em}
.vtab b{font-weight:600;font-size:.92rem;line-height:1.25}
.vtab.on{background:var(--panel2);border-color:var(--mute)}
.vtab.on.war{border-color:var(--war)} .vtab.on.peace{border-color:var(--peace)}
@media (max-width:640px){.vtabs{grid-template-columns:1fr 1fr}}
.vhead{display:flex;flex-direction:column;gap:8px}
.vhead p{color:var(--fg2)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.82rem;color:var(--fg2);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:6px}
.toc a:hover{color:var(--fg);border-color:var(--line2)}
.toc a.read{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
.secs{display:flex;flex-direction:column;gap:10px}
details.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);scroll-margin-top:90px}
details.sec[open]{border-color:var(--line2)}
details.sec summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 18px;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
.sec .lt{font-family:var(--mono);font-size:.78rem;color:var(--mute);width:22px}
.sec .tt b{display:block;font-family:var(--display);font-weight:600;font-size:1.03rem;line-height:1.3}
.sec .tt span{font-size:.84rem;color:var(--mute)}
.sec .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:.7rem;color:transparent}
.sec.done .st{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.sec .body{padding:2px 18px 18px 54px;display:flex;flex-direction:column;gap:14px;max-width:76ch}
@media (max-width:600px){.sec .body{padding:2px 16px 16px}}
.body ul,.body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.body li::marker{color:var(--mute)}
.body dfn{font-style:normal;font-weight:600}
.body b{font-weight:600;color:var(--fg)}
.body p,.body li{color:var(--fg2)}
.body .d{display:inline-block;font-size:.8rem;padding:1px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);margin-right:4px;white-space:nowrap}
.body a.t,.inl a.t{color:var(--fg);text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:3px;cursor:pointer}
.body a.t:hover{text-decoration-color:var(--fg)}
.body .def{padding:12px 14px;border-radius:8px;background:var(--panel2);color:var(--fg)}
ol.steps{list-style:none;padding:0;counter-reset:s;gap:12px}
ol.steps li{counter-increment:s;position:relative;padding-left:34px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);font-family:var(--mono);font-size:.72rem;display:grid;place-items:center;color:var(--fg2)}
.box{padding:13px 15px;border-radius:8px;border:1px solid var(--line2);color:var(--fg2);font-size:.94rem}
.box b:first-child{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.box.retenir{background:var(--ok-soft);border-color:rgba(220,220,220,.35)}
.box.retenir b:first-child{color:var(--ok)}
.box.piege{background:var(--warn-soft);border-color:rgba(180,180,180,.35)}
.box.piege b:first-child{color:var(--warn)}
.box.ex b:first-child{color:var(--fg)}
.box.nb{border-style:dashed}
.box.nb b:first-child{color:var(--mute)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{padding:13px 14px;border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;gap:6px}
.vs .lab,.tri .lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tri>div{padding:13px 14px;border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.vs,.tri{grid-template-columns:1fr}}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.exlist>div{padding:11px 13px;border-left:2px solid var(--line2);background:var(--bg2);border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:3px}
.exlist .d{align-self:flex-start}
.exlist b{font-size:.92rem}
.exlist p{font-size:.86rem}
.defs{margin:0;display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:8px 16px}
.defs dt{font-weight:600}
.defs dd{margin:0;color:var(--fg2)}
@media (max-width:600px){.defs{grid-template-columns:1fr}.defs dd{margin-bottom:6px}}
.p5{display:flex;flex-wrap:wrap;gap:6px}
.p5 span{padding:6px 12px;border:1px solid rgba(220,220,220,.45);border-radius:6px;font-size:.88rem;color:var(--fg)}
.p5 small{color:var(--mute)}
ul.tl{list-style:none;padding:0;gap:8px}
ul.tl li{display:flex;gap:10px;align-items:baseline}
.markrow{display:flex;justify-content:flex-end;padding-top:4px}

/* ---------- glossaire ---------- */
.tools{display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px;z-index:5;border-bottom:1px solid var(--line)}
@media (max-width:860px){.tools{position:static}}
.terms{display:flex;flex-direction:column;gap:8px}
.term{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);scroll-margin-top:170px;transition:border-color .2s}
.term.flash{border-color:var(--fg2)}
.term-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;cursor:pointer}
.term-h b{font-family:var(--display);font-weight:600;font-size:1.04rem}
.term-h p{color:var(--fg2);font-size:.93rem;margin-top:3px}
.term.ok .term-h b::after{content:" ✓";color:var(--ok);font-size:.9rem}
.term-b{padding:0 16px 16px;display:grid;gap:12px}
.term-b .f{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;font-size:.92rem}
.term-b .f>span:first-child{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.term-b .f>div{color:var(--fg2)}
@media (max-width:600px){.term-b .f{grid-template-columns:1fr;gap:2px}}
.lnk{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:3px;font-size:inherit}
.count{font-family:var(--mono);font-size:.8rem;color:var(--mute)}

/* ---------- distinctions ---------- */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.dcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.dcard .pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.dcard .pair>div{padding:14px;display:flex;flex-direction:column;gap:5px}
.dcard .pair b{font-family:var(--display);font-weight:600}
.dcard .pair p{font-size:.88rem;color:var(--fg2)}
.dcard .vsx{display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--mute);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 8px}
.dcard .foot{border-top:1px solid var(--line);padding:11px 14px;font-size:.86rem;color:var(--fg2);display:flex;flex-direction:column;gap:3px;margin-top:auto}
.dcard .foot span{color:var(--mute)}

/* ---------- exercices / quiz ---------- */
.qcats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.qcats{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.qcats{grid-template-columns:1fr}}
.qcat{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left}
.qcat:hover{border-color:var(--line2)}
.qcat b{font-family:var(--display);font-size:1.05rem;font-weight:600}
.qcat p{font-size:.85rem;color:var(--mute);flex:1}
.qcat .sc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--fg2)}
.qcat.special{background:var(--bg2);border-style:dashed}
.qbox{display:flex;flex-direction:column;gap:18px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qprog{flex:1;max-width:260px}
.qq{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.3}

.opts{display:flex;flex-direction:column;gap:8px}

<script>
/* ============ COURS : 2 parties, 4 vidéos ============ */
const PARTS = [
  { n: 1, roman: "I", title: "Faire la guerre", key: "guerre" },
  { n: 2, roman: "II", title: "Faire la paix", key: "paix" }
];

const COURSE = [
{
  id: "v1", part: 1, n: 1, short: "Clausewitz",
  title: "Le modèle de la guerre selon Clausewitz",
  intro: "Comprendre le modèle théorique de la guerre classique, puis l'appliquer à la guerre de Sept Ans et aux guerres napoléoniennes.",
  sections: [
  { id: "v1a", t: "Qui est Clausewitz ?", sum: "Général prussien (1780-1831), auteur de De la guerre.",
    h: `<p><dfn>Carl von Clausewitz</dfn> <span class="d">1780-1831</span> est un général prussien et un théoricien majeur de la guerre.</p>
<ul>
<li>Il entre dans l'armée à 13 ans.</li>
<li>Il participe aux guerres révolutionnaires et napoléoniennes.</li>
<li>Il vit la défaite prussienne face à Napoléon à <b>Iéna</b> <span class="d">1806</span>.</li>
<li>À partir de cette expérience, il développe une réflexion théorique sur la nature de la guerre.</li>
</ul>
<p>Son ouvrage majeur est <i>De la guerre</i>, publié après sa mort <span class="d">1832</span>.</p>
<div class="box retenir"><b>À retenir</b>Clausewitz est à la fois un praticien (il a combattu) et un théoricien. Son modèle sert de référence pour analyser toutes les guerres, y compris celles qui s'en éloignent.</div>` },

  { id: "v1b", t: "Les cinq grands principes", sum: "Duel, continuation de la politique, caméléon, brouillard, ascension aux extrêmes.",
    h: `<ol class="steps">
<li><b><a class="t" data-term="duel">La guerre comme duel</a></b><br>Un affrontement entre deux adversaires. Chacun cherche à imposer sa volonté à l'autre. La violence est un moyen de contraindre l'adversaire.</li>
<li><b><a class="t" data-term="continuation">La continuation de la politique par d'autres moyens</a></b><br>La guerre n'est pas indépendante de la politique. Elle permet à un État de poursuivre des objectifs politiques : c'est un instrument au service d'une volonté politique.</li>
<li><b><a class="t" data-term="cameleon">La guerre comme caméléon</a></b><br>Chaque guerre est différente. Elle dépend de son contexte historique, politique et social. Il faut donc analyser chaque conflit dans son contexte.</li>
<li><b><a class="t" data-term="brouillard">Le brouillard de guerre</a></b><br>Les informations sont incomplètes. Les décisions sont prises dans l'incertitude. Personne ne maîtrise totalement la situation.</li>
<li><b><a class="t" data-term="ascension">L'ascension aux extrêmes</a></b><br>La violence peut s'intensifier progressivement. Chaque adversaire cherche à surpasser l'autre. Cette escalade peut conduire à une violence considérable.</li>
</ol>
<div class="box retenir"><b>À retenir</b>La formule la plus citée en dissertation : la guerre est « la continuation de la politique par d'autres moyens ». Elle montre que la guerre a toujours un but politique.</div>` },

  { id: "v1c", t: "Guerre réelle et guerre absolue", sum: "Deux notions à distinguer absolument.",
    h: `<div class="vs">
<div><span class="lab">Guerre réelle</span><p>Conflit qui poursuit des <b>objectifs concrets et limités</b>, généralement politiques ou territoriaux. La guerre est un moyen d'obtenir quelque chose.</p></div>
<div><span class="lab">Guerre absolue</span><p><b>Modèle théorique</b> d'une guerre poussée vers l'extrême, où la logique de violence tend vers l'anéantissement de l'adversaire.</p></div>
</div>
<p>Les guerres napoléoniennes aident à comprendre cette montée vers une guerre plus extrême : mobilisation de masse, objectifs de grande ampleur, violence accrue.</p>
<div class="box piege"><b>Attention à ne pas confondre</b>La <a class="t" data-term="absolue">guerre absolue</a> est un modèle théorique, une limite vers laquelle la guerre peut tendre. La <a class="t" data-term="aneantissement">guerre d'anéantissement</a> décrit des guerres réelles qui visent la destruction totale de l'adversaire. Les deux idées se rapprochent, mais ce ne sont pas des synonymes.</div>` },

  { id: "v1d", t: "Le modèle classique ou conventionnel", sum: "Les cinq caractéristiques de la guerre clausewitzienne.",
    h: `<p>Le modèle classique de la guerre est le <b>modèle clausewitzien</b>. On l'appelle aussi <a class="t" data-term="conventionnelle">guerre conventionnelle</a>. Il a cinq caractéristiques :</p>
<ol class="steps">
<li>Il oppose principalement des États : c'est une guerre <a class="t" data-term="interetatique">interétatique</a>.</li>
<li>Il poursuit un objectif politique.</li>
<li>Il est encadré par des règles et des conventions : les civils doivent notamment être protégés.</li>
<li>Il a un début et une fin identifiables : déclaration de guerre et traité de paix.</li>
<li>Il oppose des armées régulières et identifiables, sur un territoire déterminé.</li>
</ol>
<div class="box retenir"><b>Astuce mémo</b>États · Politique · Règles · Début/fin · Armées régulières. Ces cinq critères servent de grille pour tester n'importe quel conflit : plus il en remplit, plus il est « clausewitzien ».</div>` },

  { id: "v1e", t: "La guerre de Sept Ans", sum: "1756-1763 : l'exemple type de guerre conventionnelle.",
    h: `<p><span class="d">1756-1763</span> Un exemple important pour comprendre l'application du modèle de Clausewitz.</p>
<ul>
<li>Deux grandes coalitions s'affrontent.</li>
<li>D'un côté : <b>Royaume-Uni et Prusse</b>.</li>
<li>De l'autre : <b>France, Autriche, Russie</b> et leurs alliés.</li>
<li>Le conflit se déroule en Europe, en Amérique et en Asie.</li>
<li>Il oppose des États, des armées organisées et des coalitions identifiées.</li>
<li>Il poursuit des objectifs politiques et territoriaux.</li>
</ul>
<div class="box ex"><b>Exemple à mobiliser</b>La guerre de Sept Ans coche les cinq critères du modèle classique : États, objectifs politiques et territoriaux, armées régulières, coalitions identifiées, début et fin nets (elle se termine par des traités de paix en 1763, dont le traité de Paris).</div>` },

  { id: "v1f", t: "Les guerres napoléoniennes", sum: "1796-1814 : la guerre devient nationale et plus violente.",
    h: `<p><span class="d">1796-1814</span> Elles illustrent les transformations de la guerre à l'époque moderne.</p>
<ul>
<li>La <b>Révolution française</b> <span class="d">1789</span> rapproche le peuple de l'armée.</li>
<li>La guerre devient une affaire nationale et populaire.</li>
<li>La <a class="t" data-term="conscription">conscription</a> permet de mobiliser des masses de soldats.</li>
<li>Les objectifs politiques et territoriaux prennent une grande ampleur.</li>
<li>La violence s'intensifie.</li>
</ul>
<div class="exlist">
<div><span class="d">1805</span><b>Austerlitz</b><p>Grande victoire napoléonienne.</p></div>
<div><span class="d">1808</span><b>Guerre d'Espagne</b><p>Développement de la <a class="t" data-term="guerilla">guérilla</a> contre les troupes françaises.</p></div>
<div><span class="d">1812</span><b>Campagne de Russie</b><p>Difficultés militaires, recul français, politique de la <a class="t" data-term="terre-brulee">terre brûlée</a>.</p></div>
</div>
<div class="box retenir"><b>À retenir</b>La guérilla espagnole montre déjà les <b>limites du modèle classique</b> : des combattants qui ne sont pas une armée régulière tiennent tête à la meilleure armée d'Europe.</div>
<div class="box nb"><b>Précision sur le cours</b>Le cours retient la périodisation 1796-1814 (de la campagne d'Italie à la première abdication). D'autres manuels datent les guerres napoléoniennes de 1803-1815. Garde la date de ton cours.</div>` }
  ]
},
{
  id: "v2", part: 1, n: 2, short: "Mutations",
  title: "Les mutations de la guerre contemporaine",
  intro: "Des guerres mondiales aux conflits d'aujourd'hui : ce qui reste du modèle de Clausewitz et ce qui change.",
  sections: [
  { id: "v2a", t: "Les guerres mondiales", sum: "Continuité du modèle, mais une violence inédite.",

  nc: "Ce n'est pas une guerre « ancienne » : c'est un modèle, qui peut encore servir à analyser des guerres actuelles.", rel: ["conventionnelle", "duel"] },
{ id: "civile", n: "Guerre civile", c: "types", diff: 1, k: ["guerre civile", "guerres civiles"],
  d: "Conflit armé entre des groupes appartenant à un même pays.",
  x: "C'est une forme de guerre intraétatique. Le mot « civile » insiste sur les acteurs (des membres d'une même société), « intraétatique » sur le cadre (un seul État).",
  ex: "Guerres civiles au Liberia et en Sierra Leone dans les années 1990.",
  nc: "Guerre interétatique.", rel: ["intraetatique", "rebelle", "milice"] },
{ id: "froide", n: "Guerre froide", c: "types", diff: 1, k: ["guerre froide"],
  d: "Rivalité durable entre puissances sans affrontement militaire direct généralisé entre elles.",
  x: "Désigne surtout la rivalité entre les États-Unis et l'URSS (en général datée de 1947 à 1991) : idéologique, politique, économique et militaire. La dissuasion nucléaire empêche la guerre directe.",
  ex: "Crise des missiles de Cuba (1962) ; guerres de Corée et du Vietnam.",
  nc: "Guerre chaude : affrontement militaire direct. Pendant la guerre froide, il existe des guerres chaudes, mais en périphérie.", rel: ["chaude", "dissuasion", "peripherie"] },
{ id: "chaude", n: "Guerre chaude", c: "types", diff: 2, k: ["guerre chaude"],
  d: "Affrontement militaire direct entre adversaires.",
  x: "Le terme sert surtout par opposition à la guerre froide : les combats ont réellement lieu.",
  ex: "La guerre de Corée (1950-1953) est une guerre chaude au cœur de la guerre froide.",
  nc: "Guerre froide.", rel: ["froide"] },
{ id: "peripherie", n: "Guerre de périphérie", c: "types", diff: 2, k: ["peripherie"],
  d: "Conflit local dans lequel interviennent des puissances extérieures pour défendre leurs intérêts.",
  x: "Pendant la guerre froide, les superpuissances ne s'affrontent pas directement mais soutiennent des camps opposés dans des conflits locaux. Ces conflits peuvent être intraétatiques.",
  ex: "Guerre de Corée (1950-1953), guerre du Vietnam (1955-1975), guerre d'Afghanistan (1979-1989).",
  nc: "Ce n'est pas une guerre directe entre États-Unis et URSS.", rel: ["froide", "intraetatique"] },
{ id: "aneantissement", n: "Guerre d'anéantissement", c: "types", diff: 3, k: ["aneantissement"],
  d: "Guerre réelle qui vise la destruction totale de l'adversaire, et pas seulement sa défaite.",
  x: "Les limites disparaissent : les civils deviennent des cibles, l'ennemi doit être détruit. Le cours l'associe à la Seconde Guerre mondiale.",
  ex: "Seconde Guerre mondiale (1939-1945).",
  nc: "Guerre absolue : modèle théorique de Clausewitz. L'anéantissement décrit des guerres réelles. Les deux idées se rapprochent sans être synonymes.", rel: ["absolue", "ascension"] },

/* ---- Modalités ---- */
{ id: "modalite", n: "Modalité de guerre", c: "modal", diff: 2, k: ["modalite"],
  d: "Manière dont un conflit est concrètement mené : les méthodes et les moyens employés.",
  x: "Se demander quelle est la modalité d'une guerre, c'est se demander comment on combat : armées régulières, guérilla, terrorisme, drones, dissuasion.",
  ex: "La guérilla espagnole de 1808 est une modalité irrégulière.",
  nc: "Type de guerre : qui s'affronte et dans quel cadre.", rel: ["type-guerre", "reguliere", "irreguliere"] },
{ id: "reguliere", n: "Guerre régulière", c: "modal", diff: 1, k: ["reguliere", "armees regulieres"],
  d: "Combat mené par des armées organisées et hiérarchisées.",
  x: "Soldats en uniforme, chaîne de commandement, batailles rangées : c'est la modalité du modèle classique.",
  ex: "Bataille d'Austerlitz (1805).",
  nc: "Guerre irrégulière.", rel: ["irreguliere", "conventionnelle"] },
{ id: "irreguliere", n: "Guerre irrégulière", c: "modal", diff: 2, k: ["irreguliere", "irreguliers"],
  d: "Conflit dans lequel au moins un acteur utilise des méthodes qui s'éloignent du modèle classique des armées régulières.",
  x: "Le mot décrit les méthodes de combat : guérilla, attentats, embuscades. Elle n'est pas nouvelle (Espagne, 1808) mais se développe depuis les années 1990.",
  ex: "Guérilla espagnole contre Napoléon (1808) ; attentats du 11 septembre 2001.",
  nc: "Guerre asymétrique : décrit la différence de puissance, pas les méthodes.", rel: ["asymetrique", "guerilla", "terrorisme"] },
{ id: "asymetrique", n: "Guerre asymétrique", c: "modal", diff: 2, k: ["asymetrique", "asymetrie"],
  d: "Affrontement entre adversaires dont les moyens, la puissance ou les capacités sont très différents.",
  x: "Le mot décrit le rapport de force. Le plus faible compense souvent en choisissant des méthodes irrégulières, d'où la confusion fréquente entre les deux notions.",
  ex: "Les États-Unis contre Al-Qaïda après 2001 : asymétrique et irrégulière. La guerre du Golfe (1991) : asymétrique mais menée par des armées régulières.",
  nc: "Guerre irrégulière : décrit les méthodes.", rel: ["irreguliere", "non-etatique"] },
{ id: "guerilla", n: "Guérilla", c: "modal", diff: 1, k: ["guerilla"],
  d: "Méthode de combat fondée sur des attaques ponctuelles et mobiles, souvent employée par un acteur moins puissant.",
  x: "Le mot vient de l'espagnol (« petite guerre »). Les combattants harcèlent l'ennemi, se cachent dans la population et évitent la bataille rangée.",
  ex: "Guerre d'Espagne contre les troupes de Napoléon (à partir de 1808).",
  nc: "Terrorisme : vise d'abord des civils pour provoquer la peur.", rel: ["irreguliere", "asymetrique"] },
{ id: "terrorisme", n: "Terrorisme", c: "modal", diff: 1, k: ["terrorisme", "attentat"],
  d: "Recours à la violence contre des civils ou des non-combattants pour provoquer la peur et atteindre des objectifs politiques ou idéologiques.",
  x: "C'est une méthode irrégulière. La peur produite compte autant que les dégâts : l'effet médiatique fait partie de la stratégie.",
  ex: "Attentats du 11 septembre 2001 (Al-Qaïda).",
  nc: "Guérilla : vise surtout des forces armées.", rel: ["org-terroriste", "irreguliere"] },
{ id: "dissuasion", n: "Dissuasion nucléaire", c: "modal", diff: 1, k: ["dissuasion"],
  d: "Stratégie qui vise à empêcher une attaque par la menace d'une riposte nucléaire.",
  x: "L'arme nucléaire sert à ne pas faire la guerre : la riposte rendrait toute attaque beaucoup trop coûteuse. Elle explique l'absence de guerre directe entre États-Unis et URSS.",
  ex: "Crise des missiles de Cuba (1962).",
  nc: "Ce n'est pas l'usage de l'arme nucléaire, mais la menace de l'utiliser.", rel: ["froide"] },
{ id: "distance", n: "Guerre à distance", c: "modal", diff: 2, k: ["a distance", "drone"],
  d: "Guerre menée avec des moyens qui permettent d'agir sans présence physique directe sur le champ de bataille.",
  x: "Drones, missiles, frappes aériennes : le combattant est loin de sa cible. C'est l'une des mutations des moyens depuis les années 1990.",
  ex: "Usage des drones dans les guerres récentes, notamment en Ukraine.",
  nc: "Ce n'est pas une guerre irrégulière : des armées régulières l'utilisent.", rel: ["irreguliere"] },
{ id: "conscription", n: "Conscription", c: "modal", diff: 2, k: ["conscription", "levee en masse"],
  d: "Obligation pour les citoyens d'effectuer un service militaire.",
  x: "Avec la Révolution française, la guerre devient l'affaire de la nation : la levée en masse (1793) puis la conscription fournissent des armées immenses.",
  ex: "Les armées napoléoniennes.",
  nc: "Armée de métier, formée de soldats professionnels.", rel: ["ascension"] },
{ id: "terre-brulee", n: "Politique de la terre brûlée", c: "modal", diff: 2, k: ["terre brulee"],
  d: "Stratégie qui consiste à détruire ressources et habitations pour priver l'ennemi de tout ravitaillement.",
  x: "En se retirant, on ne laisse rien d'utilisable. L'armée ennemie, loin de ses bases, s'épuise.",
  ex: "Campagne de Russie (1812) : les Russes reculent et détruisent ; Moscou brûle.",
  nc: "", rel: ["asymetrique"] },

/* ---- Clausewitz ---- */
{ id: "reelle", n: "Guerre réelle", c: "clause", diff: 2, k: ["guerre reelle"],
  d: "Conflit qui poursuit des objectifs concrets et limités, généralement politiques ou territoriaux.",
  x: "C'est la guerre telle qu'elle se pratique : un moyen d'obtenir quelque chose. Les contraintes (politiques, matérielles) la limitent.",
  ex: "Guerre de Sept Ans : des objectifs territoriaux précis.",
  nc: "Guerre absolue : modèle théorique d'escalade vers l'anéantissement.", rel: ["absolue", "continuation"] },
{ id: "absolue", n: "Guerre absolue", c: "clause", diff: 3, k: ["guerre absolue"],
  d: "Modèle théorique d'une guerre poussée vers l'extrême, où la violence tend vers l'anéantissement de l'adversaire.",
  x: "Clausewitz l'imagine comme une limite logique : sans contraintes, l'ascension aux extrêmes mènerait à la destruction totale. Les guerres napoléoniennes s'en rapprochent.",
  ex: "Les guerres napoléoniennes illustrent la montée vers une guerre plus extrême.",
  nc: "Guerre réelle. Et guerre d'anéantissement, qui décrit des guerres réelles.", rel: ["reelle", "ascension", "aneantissement"] },
{ id: "ascension", n: "Ascension aux extrêmes", c: "clause", diff: 2, k: ["ascension aux extremes", "escalade"],
  d: "Tendance de la violence à s'intensifier, chaque adversaire cherchant à surpasser l'autre.",
  x: "Chaque camp répond à l'autre par plus de force : c'est une escalade. Elle peut conduire à une violence considérable.",
  ex: "Guerres napoléoniennes, guerres mondiales.",
  nc: "Guerre absolue : l'aboutissement théorique de cette escalade.", rel: ["absolue", "duel"] },
{ id: "brouillard", n: "Brouillard de guerre", c: "clause", diff: 1, k: ["brouillard"],
  d: "Incertitude qui caractérise les conflits : les acteurs ne disposent jamais d'informations parfaitement fiables ou complètes.",
  x: "Les décisions sont prises dans l'incertitude. Ni les dirigeants ni les militaires ne maîtrisent totalement la situation.",
  ex: "La campagne de Russie (1812) : Napoléon pense obtenir une bataille décisive qui ne vient pas.",
  nc: "", rel: ["duel", "cameleon"] },
{ id: "duel", n: "La guerre comme duel", c: "clause", diff: 1, k: ["duel"],
  d: "La guerre est un affrontement entre deux adversaires, où chacun cherche à imposer sa volonté à l'autre.",
  x: "La violence est un moyen de contraindre l'adversaire, pas une fin. Le vainqueur est celui qui fait plier la volonté de l'autre.",
  ex: "Deux coalitions face à face pendant la guerre de Sept Ans.",
  nc: "", rel: ["continuation", "ascension"] },
{ id: "continuation", n: "Continuation de la politique par d'autres moyens", c: "clause", diff: 1, k: ["continuation de la politique", "autres moyens"],
  d: "La guerre est un instrument au service d'une volonté politique, pas une activité indépendante.",
  x: "La formule la plus célèbre de Clausewitz. Elle signifie que la guerre a toujours un but politique et que le politique doit commander au militaire.",
  ex: "La guerre de Sept Ans poursuit des objectifs politiques et territoriaux.",
  nc: "Elle ne dit pas que la guerre est normale ou souhaitable : elle dit qu'elle sert un but.", rel: ["duel", "reelle"] },
{ id: "cameleon", n: "La guerre comme caméléon", c: "clause", diff: 2, k: ["cameleon"],
  d: "Chaque guerre est différente, car elle dépend de son contexte historique, politique et social.",
  x: "Comme un caméléon change de couleur, la guerre change de forme. Il faut donc analyser chaque conflit dans son contexte.",
  ex: "La guerre de Sept Ans et la guérilla espagnole sont deux visages très différents de la guerre.",
  nc: "", rel: ["brouillard"] },

  nc: "Acteur non étatique.", rel: ["non-etatique", "souverainete"] },
{ id: "non-etatique", n: "Acteur non étatique", c: "acteurs", diff: 1, k: ["non etatique", "non-etatique"],

  nc: "Acteur étatique.", rel: ["etatique", "destatisation", "rebelle", "smp"] },

  nc: "Milice : distincte de l'armée officielle, mais pas forcément opposée au pouvoir.", rel: ["milice", "civile"] },
{ id: "milice", n: "Milice", c: "acteurs", diff: 2, k: ["milice"],
  d: "Groupe armé organisé, généralement distinct de l'armée officielle.",

  nc: "Groupe rebelle : défini par son opposition au pouvoir.", rel: ["rebelle", "non-etatique"] },
{ id: "org-terroriste", n: "Organisation terroriste", c: "acteurs", diff: 1, k: ["terroriste"],
  d: "Organisation qui utilise la violence contre des civils ou des non-combattants pour atteindre des objectifs politiques ou idéologiques.",
  x: "Acteur non étatique, souvent transnational. Elle utilise des méthodes irrégulières et s'appuie sur les médias.",
  ex: "Al-Qaïda (11 septembre 2001), Daesh.",
  nc: "Groupe rebelle : ne vise pas forcément des civils.", rel: ["terrorisme", "enjeu-transnational"] },
{ id: "cartel", n: "Cartel", c: "acteurs", diff: 2, k: ["cartel"],
  d: "Organisation criminelle qui peut être impliquée dans des conflits armés.",
  x: "Son objectif est d'abord économique (trafics), mais sa puissance armée peut en faire un acteur de conflit face à l'État.",
  ex: "Complément hors vidéos : les cartels de la drogue au Mexique.",
  nc: "Organisation terroriste : objectif politique ou idéologique.", rel: ["non-etatique"] },
{ id: "smp", n: "Société militaire privée (SMP)", c: "acteurs", diff: 1, k: ["societe militaire privee", "smp", "wagner", "blackwater"],
  d: "Entreprise privée qui fournit des services militaires ou de sécurité.",
  x: "La guerre devient aussi un marché. Des États font appel à des SMP pour agir de façon moins visible.",

  nc: "Milice : pas une entreprise.", rel: ["non-etatique", "destatisation"] },
{ id: "enjeu-national", n: "Enjeu national", c: "acteurs", diff: 2, k: ["enjeu national", "enjeux nationaux"],
  d: "Objectif de guerre qui concerne un État et sa nation : territoire, frontières, puissance.",
  x: "C'est l'enjeu typique du modèle de Clausewitz : un État fait la guerre pour ses intérêts.",
  ex: "Les objectifs territoriaux de la guerre de Sept Ans.",
  nc: "Enjeu transnational.", rel: ["enjeu-transnational"] },
{ id: "enjeu-transnational", n: "Enjeu transnational", c: "acteurs", diff: 2, k: ["transnational"],
  d: "Objectif de guerre qui dépasse les frontières des États : idéologique, religieux, économique.",
  x: "Certains groupes ne défendent pas une nation mais une cause qui traverse les frontières.",
  ex: "Al-Qaïda et Daesh poursuivent des objectifs idéologiques et religieux transnationaux.",
  nc: "Enjeu national.", rel: ["enjeu-national", "destatisation"] },
{ id: "destatisation", n: "Déstatisation de la guerre", c: "acteurs", diff: 3, k: ["destatisation"],
  d: "Processus par lequel l'État perd le monopole de la guerre au profit d'acteurs non étatiques.",
  x: "Dans le modèle classique, seuls les États font la guerre. Depuis 1990, rebelles, terroristes, SMP ou cartels deviennent des acteurs à part entière.",

  nc: "Ce n'est pas la disparition des guerres entre États (Ukraine, 2022).", rel: ["non-etatique", "enjeu-transnational"] },

/* ---- Paix ---- */
{ id: "souverainete", n: "Souveraineté", c: "paix", diff: 1, k: ["souverainete", "souverain"],
  d: "Pouvoir d'un État d'exercer seul son autorité sur son territoire et de prendre ses propres décisions.",
  x: "Principe central de Westphalie : aucune autorité n'est au-dessus de l'État. Il est remis en question par la responsabilité de protéger.",
  ex: "Traités de Westphalie (1648).",
  nc: "Intégrité territoriale : le respect des frontières.", rel: ["integrite", "westphalien", "r2p"] },
{ id: "integrite", n: "Intégrité territoriale", c: "paix", diff: 1, k: ["integrite territoriale"],
  d: "Principe selon lequel le territoire et les frontières d'un État doivent être respectés.",
  x: "Un autre État n'a pas le droit de s'emparer d'une partie de ce territoire.",
  ex: "Principe violé par l'annexion de la Crimée (2014).",
  nc: "Souveraineté : l'autorité à l'intérieur des frontières.", rel: ["souverainete", "westphalien"] },
{ id: "equilibre", n: "Équilibre des puissances", c: "paix", diff: 1, k: ["equilibre des puissances", "equilibre"],
  d: "Principe qui vise à maintenir un rapport de force empêchant un État de dominer les autres.",
  x: "La paix vient de ce que personne n'est assez fort pour l'emporter seul. Si un État devient trop puissant, les autres s'allient contre lui.",
  ex: "Westphalie (1648) ; congrès de Vienne (1814-1815) face à Napoléon.",
  nc: "Sécurité collective : la solidarité de tous contre l'agresseur.", rel: ["westphalien", "securite-collective"] },
{ id: "westphalien", n: "Système westphalien", c: "paix", diff: 1, k: ["westphalien", "westphalie"],
  d: "Organisation des relations internationales issue des traités de 1648, fondée sur des États souverains qui s'équilibrent.",
  x: "Il repose sur la souveraineté, l'intégrité territoriale et l'équilibre des puissances. Il distingue clairement la guerre de la paix.",
  ex: "Traités de Westphalie (1648), prolongés au congrès de Vienne (1815).",
  nc: "Sécurité collective (SDN, ONU).", rel: ["souverainete", "integrite", "equilibre"] },
{ id: "paix-perpetuelle", n: "Paix perpétuelle", c: "paix", diff: 2, k: ["paix perpetuelle", "kant"],
  d: "Idée philosophique de Kant (1795) : les conditions d'une paix durable entre les États.",
  x: "Un mécanisme supranational de règlement des conflits, la négociation ou l'arbitrage entre États, une citoyenneté universelle.",
  ex: "Ses idées annoncent la SDN (1919) puis l'ONU (1945).",
  nc: "Ce n'est pas un traité ni une organisation qui a existé.", rel: ["supranational", "securite-collective"] },
{ id: "securite-collective", n: "Sécurité collective", c: "paix", diff: 1, k: ["securite collective"],
  d: "Principe selon lequel une agression contre un État concerne toute la communauté internationale, qui doit se mobiliser pour défendre la paix.",
  x: "La paix est garantie par la solidarité de tous. Elle fonde la SDN (1919) puis l'ONU (1945).",
  ex: "Guerre du Golfe (1990-1991) : la coalition libère le Koweït avec l'autorisation de l'ONU.",
  nc: "Équilibre des puissances : chacun pour soi, par le rapport de force.", rel: ["equilibre", "multilateralisme", "conseil-securite"] },
{ id: "supranational", n: "Organisation supranationale", c: "paix", diff: 3, k: ["supranational"],
  d: "Organisation dont les décisions s'imposent aux États membres, placée au-dessus d'eux.",
  x: "Kant imagine un mécanisme supranational. Dans les faits, l'ONU reste surtout une organisation entre États, mais le Conseil de sécurité peut adopter des résolutions qui les obligent.",
  ex: "Le mécanisme imaginé par Kant ; le Conseil de sécurité de l'ONU.",
  nc: "Organisation intergouvernementale : les États coopèrent sans abandonner leur souveraineté.", rel: ["paix-perpetuelle", "souverainete"] },
{ id: "multilateralisme", n: "Multilatéralisme", c: "paix", diff: 1, k: ["multilateralisme", "multilateral"],
  d: "Mode d'action dans lequel les décisions sont prises collectivement par plusieurs États.",
  x: "C'est la logique de l'ONU : agir ensemble, avec l'accord du Conseil de sécurité.",
  ex: "Guerre du Golfe (1990-1991).",
  nc: "Unilatéralisme.", rel: ["unilateralisme", "securite-collective"] },
{ id: "unilateralisme", n: "Unilatéralisme", c: "paix", diff: 1, k: ["unilateralisme", "unilateral"],
  d: "Action ou décision menée par un État seul, sans l'accord des autres.",
  x: "Un État puissant agit sans attendre l'autorisation collective, ce qui affaiblit l'ONU.",
  ex: "Intervention américaine en Irak (2003) sans autorisation du Conseil de sécurité.",
  nc: "Multilatéralisme.", rel: ["multilateralisme"] },
{ id: "veto", n: "Droit de veto", c: "paix", diff: 1, k: ["veto"],
  d: "Pouvoir des cinq membres permanents du Conseil de sécurité de bloquer une résolution.",
  x: "Une seule opposition d'un membre permanent suffit. Il protège les grandes puissances mais peut paralyser l'ONU.",
  ex: "Veto de la Russie sur l'Ukraine (2014, 2022).",
  nc: "", rel: ["conseil-securite"] },
{ id: "conseil-securite", n: "Conseil de sécurité", c: "paix", diff: 1, k: ["conseil de securite"],
  d: "Organe central de l'ONU pour la paix et la sécurité internationales.",
  x: "Il compte cinq membres permanents avec droit de veto : États-Unis, Russie (URSS en 1945), Chine, France, Royaume-Uni.",
  ex: "Il autorise l'intervention dans la guerre du Golfe (1990-1991).",
  nc: "Le secrétaire général (comme Kofi Annan) dirige l'administration de l'ONU, il ne vote pas au Conseil.", rel: ["veto", "securite-collective"] },
{ id: "maintien-paix", n: "Maintien de la paix", c: "paix", diff: 1, k: ["maintien de la paix", "casques bleus"],
  d: "Opérations de l'ONU qui déploient des Casques bleus pour stabiliser une zone de conflit.",
  x: "Surveillance des cessez-le-feu, stabilisation, protection des populations selon le mandat, accompagnement des processus de paix.",
  ex: "Échec à Srebrenica (1995), où les Casques bleus n'ont pas empêché le massacre.",

{ id: "c26", p: 2, df: 1, q: "Qu'est-ce que la sécurité collective ?", a: "Une agression contre un État concerne toute la communauté internationale, qui doit se mobiliser pour défendre la paix." },
{ id: "c27", p: 2, df: 1, q: "Quels sont les objectifs de la SDN ?", a: "Prévenir les guerres, encourager le désarmement, régler les conflits par la négociation, organiser la sécurité collective." },
{ id: "c28", p: 2, df: 1, q: "Pourquoi la SDN échoue-t-elle ?", a: "Absence des États-Unis, pas de moyens coercitifs, incapacité à imposer ses décisions, intérêts divergents, montée des régimes expansionnistes." },
{ id: "c29", p: 2, df: 1, q: "Quand l'ONU est-elle fondée ?", a: "Le 26 juin 1945 (signature de la Charte), à la fin de la Seconde Guerre mondiale." },
{ id: "c30", p: 2, df: 1, q: "Que font les Casques bleus ?", a: "Surveillent les cessez-le-feu, stabilisent des régions, protègent les populations selon leur mandat, accompagnent les processus de paix." },
{ id: "c31", p: 2, df: 2, q: "Pourquoi l'ONU peut-elle intervenir en Corée en 1950 ?", a: "Le contexte est particulier : l'URSS boycotte le Conseil de sécurité et ne peut donc pas utiliser son veto." },
{ id: "c32", p: 2, df: 2, q: "Résume la guerre du Golfe en quatre étapes.", a: "2 août 1990 : l'Irak envahit le Koweït. Résolutions du Conseil. Coalition internationale autorisée par l'ONU. Koweït libéré en février 1991." },
{ id: "c33", p: 2, df: 2, q: "Quels échecs sont associés au mandat de Kofi Annan ?", a: "Rwanda (1994), Srebrenica (1995), et l'intervention américaine en Irak (2003) sans autorisation du Conseil. Attention : 1994 et 1995 précèdent son mandat de secrétaire général." },
{ id: "c34", p: 2, df: 2, q: "Quelle tension pose la responsabilité de protéger ?", a: "L'équilibre entre la souveraineté des États et la protection des populations." },
{ id: "c35", p: 2, df: 2, q: "Pourquoi l'ONU est-elle impuissante face à la Russie en Ukraine ?", a: "La Russie est membre permanent : elle peut bloquer toute résolution du Conseil de sécurité par son veto." },
{ id: "c36", p: 2, df: 3, q: "Cite trois limites de l'ONU depuis les années 2010.", a: "Le veto bloque des décisions ; les grandes puissances ont des intérêts opposés ; le Conseil ne reflète plus les rapports de force actuels." },
{ id: "c37", p: 2, df: 3, q: "Quel point commun entre Clausewitz et Westphalie ?", a: "Les deux modèles placent l'État souverain au centre : la guerre comme la paix se font entre États." },
{ id: "c38", p: 1, df: 3, q: "Que signifie « la guerre est un caméléon » ?", a: "Chaque guerre change de forme selon son contexte historique, politique et social : il faut l'analyser dans ce contexte." },
{ id: "c39", p: 2, df: 2, q: "Qui défend la création de la SDN en 1919 ?", a: "Le président américain Woodrow Wilson." },
{ id: "c40", p: 2, df: 2, q: "Qui est secrétaire général de l'ONU de 1997 à 2006 ?", a: "Kofi Annan." }
];

const near = id => [id].concat(AVOID[id] || [], (GBY[id] && GBY[id].rel) || []);
const overlap = (a, b) => a.y <= (b.y2 || b.y) && b.y <= (a.y2 || a.y);

function mat(q) {
  const m = Object.assign({}, q);
  if (q.gen === "defA" || q.gen === "defB") {
    const t = GBY[q.term];
    const no = [t.id].concat(AVOID[t.id] || []);
    let d = pick(GLOSS.filter(g => no.indexOf(g.id) < 0 && g.c === t.c), 3);
    if (d.length < 3) d = d.concat(pick(GLOSS.filter(g => no.indexOf(g.id) < 0 && d.indexOf(g) < 0), 3 - d.length));
    if (q.gen === "defA") { m.q = "Quelle notion correspond à cette définition ?"; m.quote = t.d; m.o = [t.n].concat(d.map(x => x.n)); }
    else { m.q = "Quelle est la bonne définition de : " + t.n + " ?"; m.o = [t.d].concat(d.map(x => x.d)); }
    m.a = 0; m.e = t.n + " : " + t.d + (t.ex ? " Exemple : " + t.ex : ""); m.term = t.id;
  }
  if (q.gen === "dateA") {
    const e = EBY[q.ev]; const ds = []; shuffle(EVENTS).forEach(x => { if (x.d !== e.d && ds.indexOf(x.d) < 0 && ds.length < 3) ds.push(x.d); });
    m.q = "Quelle est la date de cet événement : " + e.t + " ?"; m.o = [e.d].concat(ds); m.a = 0; m.e = e.t + " : " + e.d + ". " + e.i;
  }
  if (q.gen === "dateB") {
    const e = EBY[q.ev]; const ts = pick(EVENTS.filter(x => x.id !== e.id && !overlap(x, e)), 3).map(x => x.t);
    m.q = "Quel événement correspond à la date " + e.d + " ?"; m.o = [e.t].concat(ts); m.a = 0; m.e = e.d + " : " + e.t + ". " + e.x;
  }
  if (q.gen === "exA") {
    const e = EBY[q.ev]; const good = GBY[e.n[0]];
    const no = []; e.n.forEach(n => near(n).forEach(x => no.push(x)));
    const bad = pick(GLOSS.filter(g => no.indexOf(g.id) < 0 && g.id !== "type-guerre" && g.id !== "modalite"), 3);
    m.q = "Quelle notion l'événement « " + e.t + " » (" + e.d + ") permet-il d'illustrer ?"; m.o = [good.n].concat(bad.map(x => x.n)); m.a = 0;
    m.e = e.i + " Notions liées : " + e.n.map(n => GBY[n].n).join(", ") + ".";
  }
  if (q.gen === "distA") {
    const d = DIST.find(x => x.id === q.dist); const it = d.items[q.idx];
    m.q = it[0]; m.sub = "Cette situation relève plutôt de :"; m.o = [d.a.t, d.b.t]; m.a = it[1] === "a" ? 0 : 1; m.keep = true;
    m.e = it[2] + " Critère : " + d.key;
  }
  if (m.t === "mcq") { const idx = m.keep ? m.o.map((_, i) => i) : shuffle(m.o.map((_, i) => i)); m.opts = idx.map(i => ({ t: m.o[i], ok: i === m.a })); }
  if (m.t === "match") m.rights = shuffle(m.p.map(x => x[1]));
  if (m.t === "order") { let o = shuffle(m.it); if (o.every((x, i) => x === m.it[i])) o = o.slice().reverse(); m.cur = o; }
  return m;
}

/* ================= progression ================= */
function prog() {
  const read = SECS.filter(s => S.read[s.id]).length;
  const gl = GLOSS.filter(g => S.gloss[g.id]).length;
  let cd = 0, cm = 0, cr = 0, cc = 0;
  CARDS.forEach(c => { const st = S.cards[c.id]; if (st === "maitrise") { cd += 1; cm++; } else if (st === "cours") { cd += .5; cc++; } else if (st === "revoir") cr++; });
  const qv = QCATS.map(c => (S.quiz[c.id] && S.quiz[c.id].best) || 0);
  const quizP = Math.round(qv.reduce((a, b) => a + b, 0) / QCATS.length);
  const parts = { read: pct(read, SECS.length), gloss: pct(gl, GLOSS.length), cards: pct(cd, CARDS.length), quiz: quizP };
  return { read, gl, cm, cr, cc, parts, global: Math.round((parts.read + parts.gloss + parts.cards + parts.quiz) / 4) };
}
function updateRail() {
  const p = prog();
  $("#railBar").style.width = p.global + "%";
  $("#railTxt").textContent = p.global + " % du chapitre maîtrisé";
  $("#nG").textContent = p.gl + "/" + GLOSS.length;
  $("#nF").textContent = p.cm + "/" + CARDS.length;
  $("#nQ").textContent = QCATS.filter(c => S.quiz[c.id]).length + "/" + QCATS.length;
  $("#nE").textContent = EVENTS.length;
  $("#nD").textContent = DIST.length;
}

  view.innerHTML = `<div class="wrap">
  <div class="head"><span class="eyebrow">S'entraîner</span><h1>Quiz</h1><p>Chaque série tire 10 questions au hasard dans une banque de ${ALLQ.length} questions (QCM, vrai ou faux, réponses courtes, associations, classements). Une correction expliquée suit chaque réponse.</p></div>
  <div class="qcats">${QCATS.map(c => { const r = S.quiz[c.id]; const n = ALLQ.filter(q => q.c === c.id).length;
    return `<button class="qcat" data-start="${c.id}"><b>${c.n}</b><p>${c.d}</p><div class="bar"><i style="width:${r ? r.best : 0}%"></i></div><div class="sc"><span>${n} questions</span><span>${r ? "meilleur " + r.best + " % · " + r.n + " série" + (r.n > 1 ? "s" : "") : "pas encore fait"}</span></div></button>`; }).join("")}
    <button class="qcat special" data-start="mix"><b>Examen blanc</b><p>20 questions mélangées de toutes les catégories.</p><div class="bar"><i style="width:${(S.quiz.mix || {}).best || 0}%"></i></div><div class="sc"><span>20 questions</span><span>${S.quiz.mix ? "meilleur " + S.quiz.mix.best + " %" : "pas encore fait"}</span></div></button>
    <button class="qcat special" data-start="err"${errs ? "" : " disabled style=\"opacity:.5;cursor:default\""}><b>Mes erreurs</b><p>Les questions ratées la dernière fois que tu les as vues.</p><div class="sc"><span>${errs} à refaire</span><span></span></div></button>
  </div>
  ${hard.length ? `<div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>Tes points faibles</h3><div class="todo">${hard.map(id => { const q = QBY[id]; const txt = q.gen ? (q.term ? GBY[q.term].n : q.ev ? EBY[q.ev].t : "Distinction") : q.q; return `<div class="it"><span>${esc(txt)}</span><span class="cnt">${S.qs[id].ko} erreur${S.qs[id].ko > 1 ? "s" : ""}</span></div>`; }).join("")}</div></div>` : ""}
  </div>`;
  view.onclick = e => { const b = e.target.closest("[data-start]"); if (b && !b.disabled) startQuiz(b.dataset.start); };
}

/* ================= FRISE ================= */
const FR = { f: "all", open: {} };
const Y0 = 1560, Y1 = 2030;
function evVisible(e) { return FR.f === "all" || e.part === FR.f || e.k === FR.f; }
function rFrise() {
  const pos = y => `calc(14px + (100% - 28px) * ${((y - Y0) / (Y1 - Y0)).toFixed(4)})`;
  const filt = [["all", "Tout"], ["guerre", "Faire la guerre"], ["paix", "Faire la paix"], ["conflit", "Conflits"], ["theorie", "Théories et organisations"]];
  view.innerHTML = `<div class="wrap">
  <div class="head"><span class="eyebrow">${EVENTS.length} repères · 1568 → 2022</span><h1>Frise chronologique</h1><p>Clique sur un événement pour voir son explication, son importance dans le chapitre et les notions qu'il illustre.</p></div>
  <div class="chips" id="ff">${filt.map(f => `<button class="chip${FR.f === f[0] ? " on" : ""}" data-f="${f[0]}">${f[1]}</button>`).join("")}</div>
  <div class="row" style="gap:16px;font-size:.84rem;color:var(--fg2)"><span class="row" style="gap:6px"><span class="dot war"></span>Faire la guerre</span><span class="row" style="gap:6px"><span class="dot peace"></span>Faire la paix</span></div>
  <div class="scale-wrap"><div class="scale" aria-hidden="true"><div class="axis"></div>
    ${[1600, 1700, 1800, 1900, 2000].map(y => `<span class="tick" style="left:${pos(y)}">${y}</span>`).join("")}
    ${EVENTS.map(e => { const w = e.y2 ? e.y2 - e.y : 0; return `<button class="ev ${partKey(e.part === "guerre" ? 1 : 2)}${w >= 5 ? " lane1" : ""}${evVisible(e) ? "" : " dim"}" data-ev="${e.id}" title="${esc(e.d + " · " + e.t)}" tabindex="-1" style="left:${pos(e.y)};width:${w >= 5 ? `calc((100% - 28px) * ${(w / (Y1 - Y0)).toFixed(4)} + 12px)` : "12px"}"></button>`; }).join("")}
  </div></div>
  ${PERIODS.map(P => { const evs = EVENTS.filter(e => e.p === P.id && evVisible(e)); if (!evs.length) return "";
    return `<section class="period"><div class="period-h"><h3>${P.t}</h3><span>${P.r}</span></div><div class="evs">${evs.map(e => { const k = e.part === "guerre" ? "war" : "peace", o = FR.open[e.id];
      return `<div class="evt ${k}${o ? " open" : ""}" id="ev-${e.id}"><button class="eh" data-ev="${e.id}" aria-expanded="${!!o}"><span class="yr">${e.d}</span><span class="et">${esc(e.t)}</span><span class="tag ${k}">${e.part === "guerre" ? "Guerre" : "Paix"}</span></button>
      ${o ? `<div class="eb"><div class="f"><b>Explication</b>${esc(e.x)}</div><div class="f"><b>Importance dans le chapitre</b>${esc(e.i)}</div>${e.n.length ? `<div class="f"><b>Notions illustrées</b><div class="chips" style="margin-top:6px">${e.n.map(n => `<button class="chip" data-term="${n}">${esc(GBY[n].n)}</button>`).join("")}</div></div>` : ""}<button class="lnk" data-go="cours" data-opt="${optAttr({ v: e.v })}" style="align-self:flex-start;font-size:.86rem">Voir la vidéo ${e.v.slice(1)} du cours</button></div>` : ""}</div>`; }).join("")}</div></section>`; }).join("")}
  </div>`;
  view.onclick = e => {
    const f = e.target.closest("[data-f]"); if (f) { FR.f = f.dataset.f; const y = window.scrollY; rFrise(); window.scrollTo(0, y); return; }
    const ev = e.target.closest("[data-ev]"); if (ev) {
      const id = ev.dataset.ev, fromScale = ev.classList.contains("ev");
      if (fromScale) { FR.open[id] = true; if (!evVisible(EBY[id])) FR.f = "all"; } else FR.open[id] = !FR.open[id];
      const y = window.scrollY; rFrise(); window.scrollTo(0, y);
      if (fromScale) { const el = $("#ev-" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    }
  };
}

/* ================= BAC ================= */
const BC = { tab: "sujets", open: null, plan: {}, arg: 0, argSel: [], argDone: false, mt: null };
const termKeys = id => { const g = GBY[id]; return [norm(g.n)].concat((g.k || []).map(norm)); };
function newMatch() { const ps = pick(PAIRS, 6); BC.mt = { p: ps, rights: shuffle(ps.map(x => x[1])), user: null }; }
function rBac() {
  const tabs = [["sujets", "Sujets"], ["assoc", "Notions ↔ exemples"], ["arg", "Construire un argument"], ["methode", "Méthode"]];
  view.innerHTML = `<div class="wrap">
  <div class="head"><span class="eyebrow">Épreuve écrite</span><h1>Entraînement bac</h1><p>Cherche d'abord seul : analyse le sujet, écris ta problématique et ton plan dans le brouillon, puis compare avec le plan proposé.</p></div>
  <div class="tabs">${tabs.map(t => `<button class="${BC.tab === t[0] ? "on" : ""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div id="bacbody" style="display:flex;flex-direction:column;gap:22px"></div></div>`;
  const B = $("#bacbody");
  if (BC.tab === "sujets") BC.open ? bacSubject(B) : bacList(B);
  if (BC.tab === "assoc") bacAssoc(B);
  if (BC.tab === "arg") bacArg(B);
  if (BC.tab === "methode") bacMethod(B);
  view.onclick = e => {
    const t = e.target.closest("[data-tab]"); if (t) { BC.tab = t.dataset.tab; BC.open = null; rBac(); return; }
    const s = e.target.closest("[data-subj]"); if (s) { BC.open = s.dataset.subj; S.bac[BC.open] = true; save(); rBac(); window.scrollTo(0, 0); return; }
    if (e.target.closest("#bback")) { BC.open = null; rBac(); return; }
    if (e.target.closest("#showplan")) { BC.plan[BC.open] = !BC.plan[BC.open]; const y = window.scrollY; rBac(); window.scrollTo(0, y); return; }
    if (e.target.closest("#mval")) { const u = $$("select[data-bm]").map(x => x.value); if (u.some(x => !x)) { toast("Associe tous les éléments"); return; } BC.mt.user = u; rBac(); return; }
    if (e.target.closest("#mnew")) { newMatch(); rBac(); return; }
    const ao = e.target.closest("[data-ao]"); if (ao && !BC.argDone) { const i = +ao.dataset.ao; const k = BC.argSel.indexOf(i); if (k < 0) BC.argSel.push(i); else BC.argSel.splice(k, 1); rBac(); return; }
    if (e.target.closest("#aval")) { BC.argDone = true; rBac(); return; }
    if (e.target.closest("#anext")) { BC.arg = (BC.arg + 1) % ARGS.length; BC.argSel = []; BC.argDone = false; rBac(); }
  };
  view.oninput = e => {
    if (e.target.id === "draft") {
      S.drafts[BC.open] = e.target.value; clearTimeout(rBac._t); rBac._t = setTimeout(save, 400);
      const n = norm(e.target.value); let hits = 0;
      $$("[data-nk]").forEach(c => { const h = termKeys(c.dataset.nk).some(k => n.includes(k)); c.classList.toggle("hit", h); if (h) hits++; });
      const hc = $("#hitc"); if (hc) hc.textContent = hits;
    }
  };
}
function bacList(B) {
  B.innerHTML = `<div class="subjects">${BAC.map((b, i) => `<button class="subj" data-subj="${b.id}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span><span class="ty">${b.type}</span><b>${esc(b.t)}</b></span><span class="count">${S.bac[b.id] ? (S.drafts[b.id] ? "brouillon ✓" : "vu") : "→"}</span></button>`).join("")}</div>`;
}
function bacSubject(B) {
  const b = BAC.find(x => x.id === BC.open), dr = S.drafts[b.id] || "", n = norm(dr);
  const hits = b.notions.filter(id => termKeys(id).some(k => n.includes(k))).length;
  B.innerHTML = `<button class="btn sm ghost" id="bback" style="align-self:flex-start">← Tous les sujets</button>
  <div class="head"><span class="tag">${b.type}</span><h2 style="font-size:1.6rem">${esc(b.t)}</h2></div>
  <div class="blk"><h3>1 · Analyse des termes</h3><p>${esc(b.termes)}</p></div>
  <div class="blk"><h3>2 · Problématique possible</h3><p class="pb">${esc(b.pb)}</p></div>
  <div class="blk"><h3>3 · Pistes de réflexion</h3><ul>${b.pistes.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
  <div class="grid2">
    <div class="blk"><h3>Notions à mobiliser · <span id="hitc">${hits}</span>/${b.notions.length} dans ton brouillon</h3><div class="chips">${b.notions.map(id => `<button class="nchip${termKeys(id).some(k => n.includes(k)) ? " hit" : ""}" data-nk="${id}" data-term="${id}">${esc(GBY[id].n)}</button>`).join("")}</div></div>
    <div class="blk"><h3>Exemples à mobiliser</h3><div class="chips">${b.exemples.map(x => `<span class="nchip" style="color:var(--fg2)">${esc(x)}</span>`).join("")}</div></div>
  </div>
  <div class="blk"><h3>4 · Ton brouillon de plan</h3><textarea id="draft" placeholder="Problématique, puis I. A. B. / II. A. B. … Les notions utilisées s'allument au-dessus.">${esc(dr)}</textarea><span class="count">Enregistré automatiquement dans ce navigateur.</span></div>
  <div class="blk"><h3>5 · Plan détaillé proposé</h3>
    ${BC.plan[b.id] ? `<div class="planx">${b.plan.map(p => `<div><b>${esc(p[0])}</b><ul>${p[1].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div><button class="btn sm ghost" id="showplan" style="align-self:flex-start">Masquer le plan</button>` : `<p class="mute">Essaie d'abord de construire ton propre plan.</p><button class="btn" id="showplan" style="align-self:flex-start">Afficher le plan proposé</button>`}
  </div>
  <div class="blk"><h3>Pièges à éviter</h3><div class="box piege"><b>Attention</b>${b.pieges.map(esc).join("<br>")}</div></div>`;
}
function bacAssoc(B) {
  if (!BC.mt) newMatch();
  const M = BC.mt, done = !!M.user, good = done ? M.user.filter((u, i) => u === M.p[i][1]).length : 0;
  B.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div><h3>Relie chaque notion à l'exemple qui l'illustre</h3><p class="mute" style="font-size:.9rem;margin-top:4px">Dans une copie, chaque notion doit être appuyée par un exemple précis et daté.</p></div>
    <div>${M.p.map((p, i) => { const u = done ? M.user[i] : ""; const ok = done && u === p[1];
      return `<div class="mrow${done ? (ok ? " good" : " bad") : ""}"><span>${esc(p[0])}</span><select data-bm="${i}"${done ? " disabled" : ""} aria-label="${esc(p[0])}"><option value="">Choisir…</option>${M.rights.map(r => `<option${u === r ? " selected" : ""}>${esc(r)}</option>`).join("")}</select>${done && !ok ? `<span class="fix">→ ${esc(p[1])}</span>` : ""}</div>`; }).join("")}</div>
    ${done ? `<div class="fb ${good === M.p.length ? "good" : "bad"}"><b>${good}/${M.p.length} associations justes</b><p>${good === M.p.length ? "Toutes tes associations sont justes." : "Les bonnes réponses sont indiquées en vert sous chaque ligne fausse."}</p></div><button class="btn primary" id="mnew" style="align-self:flex-start">Nouvelle série</button>` : `<button class="btn primary" id="mval" style="align-self:flex-start">Valider</button>`}
  </div>`;
}
function bacArg(B) {
  const A = ARGS[BC.arg]; const nGood = A.o.filter(o => o[1]).length;
  const right = A.o.filter((o, i) => o[1] === (BC.argSel.indexOf(i) >= 0)).length;
  B.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:14px">
    <span class="eyebrow">Argument ${BC.arg + 1}/${ARGS.length}</span>
    <p class="pb">${esc(A.idee)}</p>
    <p class="mute">Sélectionne tous les exemples qui permettent de démontrer cette idée (${nGood} sont pertinents).</p>
    <div style="display:flex;flex-direction:column;gap:8px">${A.o.map((o, i) => { const s = BC.argSel.indexOf(i) >= 0; let c = s ? " sel" : "";
      if (BC.argDone) c += o[1] ? (s ? " good" : " bad") : (s ? " bad" : "");
      return `<button class="argopt${c}" data-ao="${i}"${BC.argDone ? " disabled" : ""}><span class="bx">${s ? "✓" : ""}</span><span>${esc(o[0])}${BC.argDone ? `<small>${o[1] ? (s ? "Pertinent. " : "Oublié : il était pertinent. ") : (s ? "Hors sujet. " : "")}${esc(o[2])}</small>` : ""}</span></button>`; }).join("")}</div>
    ${BC.argDone ? `<div class="fb ${right === A.o.length ? "good" : "bad"}"><b>${right}/${A.o.length} choix justes</b><p>Un bon exemple ne se contente pas d'être sur le thème : il doit prouver l'idée.</p></div><button class="btn primary" id="anext" style="align-self:flex-start">Argument suivant →</button>` : `<button class="btn primary" id="aval" style="align-self:flex-start"${BC.argSel.length ? "" : " disabled"}>Valider</button>`}
  </div>`;
}
function bacMethod(B) {
  B.innerHTML = `<a class="btn primary" href="methodologie.html#dissertation" style="align-self:flex-start">Fiches méthode complètes : dissertation, étude critique, travailler la spé →</a>
  <div class="blk"><h3>Construire une introduction</h3>
  <ol class="steps body" style="padding-left:0"><li><b>Accroche</b> : un fait daté (« Le 2 août 1990, l'Irak envahit le Koweït… »).</li><li><b>Définition des termes</b> du sujet, avec les notions du glossaire.</li><li><b>Problématique</b> : une vraie question, qui oppose deux idées.</li><li><b>Annonce du plan</b>, en deux ou trois parties.</li></ol></div>
  <div class="blk"><h3>Le paragraphe argumenté</h3>
  <div class="method"><div><b style="color:var(--fg)">1 · Idée</b><span>Une phrase qui répond à une partie de la problématique.</span></div><div><b style="color:var(--peace)">2 · Explication</b><span>Le mécanisme, avec une notion précise.</span></div><div><b style="color:var(--war)">3 · Exemple</b><span>Un fait daté qui prouve l'idée.</span></div><div><b style="color:var(--ok)">4 · Lien</b><span>Retour au sujet : ce que l'exemple montre.</span></div></div></div>
  <div class="blk"><h3>Exemple de paragraphe (sujet : la sécurité collective)</h3>
  <p class="para"><mark class="m1">La sécurité collective peut fonctionner lorsque les grandes puissances s'accordent.</mark> <mark class="m2">Ce principe veut qu'une agression contre un État concerne toute la communauté internationale ; il suppose que le Conseil de sécurité ne soit pas bloqué par un veto.</mark> <mark class="m3">Ainsi, après l'invasion du Koweït par l'Irak le 2 août 1990, le Conseil adopte des résolutions et autorise une coalition internationale qui libère le Koweït en février 1991.</mark> <mark class="m4">La fin de la guerre froide rend donc possible ce que la rivalité entre les États-Unis et l'URSS empêchait : une réponse collective à une agression.</mark></p>
  <p class="mute" style="font-size:.88rem">À toi d'écrire les autres paragraphes : utilise le brouillon de chaque sujet.</p></div>
  <div class="blk"><h3>Réflexes pour une bonne copie</h3><ul>
  <li>Toujours dater les exemples et les relier explicitement à une notion.</li>
  <li>Utiliser les distinctions du chapitre : irrégulière ≠ asymétrique, équilibre ≠ sécurité collective.</li>
  <li>Croiser les deux parties : Clausewitz et Westphalie reposent tous deux sur l'État souverain.</li>
  <li>Nuancer : l'ONU n'est ni un succès total ni un échec total.</li></ul></div>`;
}

/* ================= démarrage ================= */
updateRail();
route();
})();
</script>

</body></html>
