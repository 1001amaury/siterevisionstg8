<title>Identifier, protéger et valoriser le patrimoine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : rail de navigation à gauche, zone de travail centrée ; sur mobile, barre collante + onglets défilants.
   Direction : salle des cartes de nuit. Deux couleurs seulement pour coder le chapitre : rouge = usages du patrimoine, gris = préservation. */
:root{
  --bg:#0d0d0d; --bg2:#141414; --panel:#1a1a1a; --panel2:#222222; --line:#2c2c2c; --line2:#3b3b3b;
  --fg:#ededed; --fg2:#bcbcbc; --mute:#888888;
  --war:#bd1026; --war-soft:rgba(189,16,38,.13);
  --peace:#ededed; --peace-soft:rgba(220,220,220,.13);
  --warn:#bdbdbd; --warn-soft:rgba(180,180,180,.1);
  --ok:#ededed; --ok-soft:rgba(220,220,220,.12);
  --ko:#ed5262; --ko-soft:rgba(189,16,38,.12);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--peace);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:700}
h2{font-size:1.45rem}
h3{font-size:1.08rem}
p{margin:0}
.mono,.d{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);padding:26px 18px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--display);font-size:1.12rem;line-height:1.2;font-weight:700}
.brand b em{font-style:normal;color:var(--war)}
.brand b i{font-style:normal;color:var(--peace)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--fg2);font-size:.94rem}
.nav a:hover{background:var(--panel);color:var(--fg)}
.nav a.on{background:var(--panel2);color:var(--fg)}
.nav a small{font-family:var(--mono);font-size:.7rem;color:var(--mute)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.mini{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--fg2);border-radius:4px;transition:width .4s}
main{min-width:0;padding-block:40px 80px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1080px}
.head{display:flex;flex-direction:column;gap:10px}
.head p{color:var(--fg2);max-width:62ch}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:auto;flex-direction:column;gap:10px;padding:12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand{flex-direction:row;align-items:baseline;justify-content:space-between}
  .brand .eyebrow{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 10px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:6px 11px;border:1px solid var(--line);border-radius:20px}
  .nav a small{display:none}
  .rail-foot{display:none}
  main{padding-block:24px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}

/* ---------- éléments communs ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:9px 15px;font-size:.92rem;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--line);border-color:var(--mute)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:20px;padding:5px 12px;font-size:.84rem;color:var(--fg2)}
.chip:hover{color:var(--fg);border-color:var(--mute)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--fg2)}
.tag.war{color:var(--war);border-color:rgba(189,16,38,.45)}
.tag.peace{color:var(--peace);border-color:rgba(220,220,220,.45)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.war{background:var(--war)} .dot.peace{background:var(--peace)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--fg2);transition:width .5s ease}
.bar.war i{background:var(--war)} .bar.peace i{background:var(--peace)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:var(--r)}
input[type=search],input[type=text],textarea,select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--fg2);cursor:pointer;user-select:none}
.check input{accent-color:var(--ok);width:16px;height:16px}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding-bottom:26px;border-bottom:1px solid var(--line)}
.hero h1 span.w{color:var(--war)} .hero h1 span.p{color:var(--peace)}
.hero p{color:var(--fg2);max-width:52ch;margin-top:12px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.ring .v small{font-size:.72rem;color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none}
.stat:hover{border-color:var(--line2)}
.stat .n{font-family:var(--display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--fg2)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.part{display:flex;flex-direction:column;gap:12px}
.part-h{display:flex;align-items:baseline;gap:10px}
.part-h .roman{font-family:var(--display);font-weight:700;font-size:1.6rem}
.part.war .roman{color:var(--war)} .part.peace .roman{color:var(--peace)}
.vid{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;transition:border-color .15s,transform .15s}
.vid:hover{border-color:var(--line2);transform:translateY(-1px)}
.vid .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vid h3{font-size:1rem;line-height:1.3}
.vid .meta{font-size:.8rem;color:var(--mute);font-variant-numeric:tabular-nums}
.todo{display:flex;flex-direction:column}
.todo a,.todo div.it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;font-size:.93rem}
.todo a:last-child{border-bottom:0}
.todo a:hover span:first-child{color:var(--fg)}
.todo span:first-child{color:var(--fg2);min-width:0}
.todo .cnt{font-family:var(--mono);font-size:.78rem;color:var(--mute);flex:none}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.space{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;background:var(--bg2)}
.space:hover{background:var(--panel)}
.space b{font-family:var(--display);font-size:1.02rem;font-weight:600}
.space span{font-size:.84rem;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .parts,.grid2{grid-template-columns:1fr}
  .spaces{grid-template-columns:1fr 1fr}
}

/* ---------- cours ---------- */
.vtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vtab{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;text-align:left;transition:border-color .15s}
.vtab:hover{border-color:var(--line2)}
.vtab .k{font-family:var(--mono);font-size:.7rem;color:var(--mute);letter-spacing:.08em}
.vtab b{font-weight:600;font-size:.92rem;line-height:1.25}
.vtab.on{background:var(--panel2);border-color:var(--mute)}
.vtab.on.war{border-color:var(--war)} .vtab.on.peace{border-color:var(--peace)}
@media (max-width:640px){.vtabs{grid-template-columns:1fr 1fr}}
.vhead{display:flex;flex-direction:column;gap:8px}
.vhead p{color:var(--fg2)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.82rem;color:var(--fg2);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:6px}
.toc a:hover{color:var(--fg);border-color:var(--line2)}
.toc a.read{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
.secs{display:flex;flex-direction:column;gap:10px}
details.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);scroll-margin-top:90px}
details.sec[open]{border-color:var(--line2)}
details.sec summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 18px;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
.sec .lt{font-family:var(--mono);font-size:.78rem;color:var(--mute);width:22px}
.sec .tt b{display:block;font-family:var(--display);font-weight:600;font-size:1.03rem;line-height:1.3}
.sec .tt span{font-size:.84rem;color:var(--mute)}
.sec .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:.7rem;color:transparent}
.sec.done .st{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.sec .body{padding:2px 18px 18px 54px;display:flex;flex-direction:column;gap:14px;max-width:76ch}
@media (max-width:600px){.sec .body{padding:2px 16px 16px}}
.body ul,.body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.body li::marker{color:var(--mute)}
.body dfn{font-style:normal;font-weight:600}
.body b{font-weight:600;color:var(--fg)}
.body p,.body li{color:var(--fg2)}
.body .d{display:inline-block;font-size:.8rem;padding:1px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);margin-right:4px;white-space:nowrap}
.body a.t,.inl a.t{color:var(--fg);text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:3px;cursor:pointer}
.body a.t:hover{text-decoration-color:var(--fg)}
.body .def{padding:12px 14px;border-radius:8px;background:var(--panel2);color:var(--fg)}
ol.steps{list-style:none;padding:0;counter-reset:s;gap:12px}
ol.steps li{counter-increment:s;position:relative;padding-left:34px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);font-family:var(--mono);font-size:.72rem;display:grid;place-items:center;color:var(--fg2)}
.box{padding:13px 15px;border-radius:8px;border:1px solid var(--line2);color:var(--fg2);font-size:.94rem}
.box b:first-child{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.box.retenir{background:var(--ok-soft);border-color:rgba(220,220,220,.35)}
.box.retenir b:first-child{color:var(--ok)}
.box.piege{background:var(--warn-soft);border-color:rgba(180,180,180,.35)}
.box.piege b:first-child{color:var(--warn)}
.box.ex b:first-child{color:var(--fg)}
.box.nb{border-style:dashed}
.box.nb b:first-child{color:var(--mute)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{padding:13px 14px;border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;gap:6px}
.vs .lab,.tri .lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tri>div{padding:13px 14px;border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.vs,.tri{grid-template-columns:1fr}}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.exlist>div{padding:11px 13px;border-left:2px solid var(--line2);background:var(--bg2);border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:3px}
.exlist .d{align-self:flex-start}
.exlist b{font-size:.92rem}
.exlist p{font-size:.86rem}
.defs{margin:0;display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:8px 16px}
.defs dt{font-weight:600}
.defs dd{margin:0;color:var(--fg2)}
@media (max-width:600px){.defs{grid-template-columns:1fr}.defs dd{margin-bottom:6px}}
.p5{display:flex;flex-wrap:wrap;gap:6px}
.p5 span{padding:6px 12px;border:1px solid rgba(220,220,220,.45);border-radius:6px;font-size:.88rem;color:var(--fg)}
.p5 small{color:var(--mute)}
ul.tl{list-style:none;padding:0;gap:8px}
ul.tl li{display:flex;gap:10px;align-items:baseline}
.markrow{display:flex;justify-content:flex-end;padding-top:4px}

/* ---------- glossaire ---------- */
.tools{display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px;z-index:5;border-bottom:1px solid var(--line)}
@media (max-width:860px){.tools{position:static}}
.terms{display:flex;flex-direction:column;gap:8px}
.term{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);scroll-margin-top:170px;transition:border-color .2s}
.term.flash{border-color:var(--fg2)}
.term-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;cursor:pointer}
.term-h b{font-family:var(--display);font-weight:600;font-size:1.04rem}
.term-h p{color:var(--fg2);font-size:.93rem;margin-top:3px}
.term.ok .term-h b::after{content:" ✓";color:var(--ok);font-size:.9rem}
.term-b{padding:0 16px 16px;display:grid;gap:12px}
.term-b .f{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;font-size:.92rem}
.term-b .f>span:first-child{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.term-b .f>div{color:var(--fg2)}
@media (max-width:600px){.term-b .f{grid-template-columns:1fr;gap:2px}}
.lnk{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:3px;font-size:inherit}
.count{font-family:var(--mono);font-size:.8rem;color:var(--mute)}

/* ---------- distinctions ---------- */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.dcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.dcard .pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.dcard .pair>div{padding:14px;display:flex;flex-direction:column;gap:5px}
.dcard .pair b{font-family:var(--display);font-weight:600}
.dcard .pair p{font-size:.88rem;color:var(--fg2)}
.dcard .vsx{display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--mute);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 8px}
.dcard .foot{border-top:1px solid var(--line);padding:11px 14px;font-size:.86rem;color:var(--fg2);display:flex;flex-direction:column;gap:3px;margin-top:auto}
.dcard .foot span{color:var(--mute)}

/* ---------- exercices / quiz ---------- */
.qcats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.qcats{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.qcats{grid-template-columns:1fr}}
.qcat{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left}
.qcat:hover{border-color:var(--line2)}
.qcat b{font-family:var(--display);font-size:1.05rem;font-weight:600}
.qcat p{font-size:.85rem;color:var(--mute);flex:1}
.qcat .sc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--fg2)}
.qcat.special{background:var(--bg2);border-style:dashed}
.qbox{display:flex;flex-direction:column;gap:18px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qprog{flex:1;max-width:260px}
.qq{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.3}

<script>
/* ============ COURS : 2 parties, 7 chapitres (introduction, axe 1, axe 2, objet conclusif) ============ */
const PARTS = [
  { n: 1, roman: "I", title: "Identifier le patrimoine et ses usages", key: "usages" },
  { n: 2, roman: "II", title: "Protéger et valoriser, entre tensions et concurrences", key: "preservation" }
];

const COURSE = [
{
  id: "v1", part: 1, n: 1, lab: "Introduction", short: "La notion",
  title: "La construction et l'élargissement de la notion de patrimoine",
  intro: "Du bien transmis dans une famille à l'héritage de toute l'humanité : comment la notion de patrimoine s'est construite, qui la protège aujourd'hui et quels défis elle pose.",
  sections: [
  { id: "v1a", t: "Définir le patrimoine", sum: "Du patrimonium romain au bien commun d'une société.",
    h: `<p class="def"><a class="t" data-term="patrimoine">Patrimoine</a> : ensemble des biens, matériels ou immatériels, culturels ou naturels, qu'une société juge dignes d'être conservés et transmis aux générations futures, parce qu'ils témoignent de son histoire et de son identité.</p>
<ul>
<li>Le mot vient du latin <i>patrimonium</i> : les biens hérités du père. C'est d'abord une notion <b>juridique et familiale</b>, qu'on retrouve encore dans le droit des successions.</li>
<li>Chez les Romains, on transmet la maison et les terres, mais aussi des biens sans valeur marchande : les portraits des ancêtres et le nom de famille.</li>
<li>Peu à peu, la notion passe de l'échelle de la <b>famille</b> à celle de la <b>nation</b>, puis de l'<b>humanité</b>.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Le patrimoine n'existe pas « naturellement » : c'est une société qui décide qu'un objet, un lieu ou une pratique mérite d'être protégé. Ce choix s'appelle la <a class="t" data-term="patrimonialisation">patrimonialisation</a>. Il dit autant sur le présent que sur le passé.</div>` },

  { id: "v1b", t: "Collections princières et premiers musées", sum: "Studiolo de la Renaissance, Ashmolean (1683), British Museum (1753), Louvre (1793).",
    h: `<p>À la Renaissance <span class="d">XVe-XVIe s.</span>, les princes et les riches collectionneurs rassemblent œuvres d'art, antiquités et objets rares dans des pièces privées : les <b>studiolo</b> italiens et les cabinets de curiosités.</p>
<ul>
<li>Ces collections servent au plaisir et à l'étude, mais aussi au <b>prestige</b> : un invité qui entre dans la Chambre des Époux des Gonzague à Mantoue (peinte par Mantegna) doit être impressionné par la puissance culturelle du prince.</li>
<li>Le patrimoine reste alors <b>privé</b>.</li>
</ul>
<div class="exlist">
<div><span class="d">1683</span><b>Ashmolean Museum (Oxford)</b><p>Premier musée public, rattaché à une université.</p></div>
<div><span class="d">1753</span><b>Fondation du British Museum</b><p>Ouvert au public en 1759.</p></div>
<div><span class="d">1793</span><b>Ouverture du Louvre</b><p>La Révolution ouvre les collections royales à tous.</p></div>
</div>
<div class="box retenir"><b>À retenir</b>Avec les musées publics naît l'idée que le public doit avoir accès à l'art et au passé : le patrimoine commence à devenir un <b>bien commun</b>.</div>
<div class="box nb"><b>Précision sur les dates</b>Une des vidéos date l'ouverture de l'Ashmolean et du British Museum « en 1753 ». C'est faux : l'Ashmolean ouvre en 1683 ; 1753 est la fondation du British Museum, qui ouvre en 1759.</div>` },

  { id: "v1c", t: "La Révolution française et l'invention du monument historique", sum: "Vandalisme, inspecteur général (1830), Mérimée, première liste (1840), loi de 1913.",
    h: `<p>La Révolution <span class="d">1789</span> nationalise les biens du clergé et de la Couronne. Beaucoup de monuments sont vendus, pillés ou détruits parce qu'ils symbolisent la monarchie ou l'Église.</p>
<ul>
<li>En réaction, l'abbé <b>Grégoire</b> dénonce en <span class="d">1794</span> le « vandalisme » (il invente le mot) : ces œuvres appartiennent désormais à la <b>nation</b>.</li>
<li>Le Louvre devient un musée public <span class="d">1793</span>.</li>
</ul>
<p>Au XIXe siècle, l'État organise la protection :</p>
<div class="exlist">
<div><span class="d">1830</span><b>Création du poste d'inspecteur général des monuments historiques</b><p>Par le ministre Guizot.</p></div>
<div><span class="d">1834</span><b>Prosper Mérimée inspecteur général</b><p>Il parcourt la France pour recenser les édifices.</p></div>
<div><span class="d">1840</span><b>Première liste des monuments historiques</b><p>Les édifices dont la restauration est jugée urgente.</p></div>
<div><span class="d">1913</span><b>Loi sur les monuments historiques</b><p>Base du système actuel de <a class="t" data-term="classement">classement</a>.</p></div>
</div>
<p>Victor Hugo, dans <i>Guerre aux démolisseurs</i> <span class="d">1825</span>, et dans <i>Notre-Dame de Paris</i> <span class="d">1831</span>, mobilise l'opinion contre la destruction du patrimoine médiéval.</p>
<div class="box nb"><b>Une citation mal attribuée</b>Une vidéo présente la phrase de Hugo sur « la démolition de la vieille France » comme une attaque contre Haussmann. Elle vient de <i>Guerre aux démolisseurs</i> (1825), écrit bien avant les travaux d'Haussmann (1853-1870). Hugo y vise les démolitions de la Restauration.</div>` },

  { id: "v1d", t: "Restaurer ou recréer ? Viollet-le-Duc et Notre-Dame", sum: "La flèche de 1859, l'authenticité et la reconstruction après 2019.",
    h: `<p><b>Viollet-le-Duc</b> restaure Notre-Dame de Paris à partir de <span class="d">1844</span>. Il ne se contente pas de réparer : il ajoute des éléments qui n'existaient pas, comme la célèbre <b>flèche</b> <span class="d">1859</span> et une partie des chimères.</p>
<p>Il défend l'idée de rétablir un édifice « dans un état complet qui peut n'avoir jamais existé à un moment donné ». Cette conception est aujourd'hui critiquée au nom de l'<a class="t" data-term="authenticite">authenticité</a>.</p>
<div class="box ex"><b>Exemple à mobiliser</b>Après l'incendie du <span class="d">15 avril 2019</span>, l'État décide de reconstruire la flèche de Viollet-le-Duc à l'identique. Un ajout du XIXe siècle est devenu lui-même patrimoine. La cathédrale rouvre en <span class="d">décembre 2024</span>.</div>
<div class="box retenir"><b>À retenir</b>Le patrimoine évolue : ce qui était une transformation contestée peut devenir un élément à protéger. La question « conserver à l'identique ou adapter ? » traverse tout le thème.</div>
<div class="box nb"><b>Précision sur les dates</b>Une vidéo parle de « l'incendie de 2010 » : il a eu lieu le 15 avril 2019.</div>` },

  { id: "v1e", t: "Le XXe siècle : destructions, reconstructions, nouveaux patrimoines", sum: "Guerres mondiales, Le Havre, patrimoine industriel, spoliations.",
    h: `<ul>
<li>Les deux guerres mondiales provoquent des <b>destructions massives</b> (Reims bombardée en 1914, villes rasées en 1944-1945).</li>
<li>La reconstruction crée à son tour du patrimoine : <b>Le Havre</b>, reconstruit par l'architecte Auguste Perret, est inscrit au patrimoine mondial en <span class="d">2005</span> comme exemple de l'urbanisme d'après-guerre.</li>
<li>La fermeture des mines et des usines fait entrer le <b>patrimoine industriel</b> dans le champ : Ironbridge Gorge, « berceau de la révolution industrielle » au Royaume-Uni, est inscrit en <span class="d">1986</span>.</li>
<li>La question des <a class="t" data-term="restitution">restitutions</a> apparaît : œuvres <a class="t" data-term="spoliation">spoliées</a> aux Juifs par les nazis (principes de la conférence de Washington, <span class="d">1998</span>), puis objets pris pendant la colonisation.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Le critère change : le patrimoine n'est plus seulement ce qui est <b>beau</b> ou ancien, mais ce qui porte la <b>trace</b> d'une histoire commune, y compris le travail, la guerre ou la reconstruction.</div>` },

  { id: "v1f", t: "L'UNESCO et la convention de 1972", sum: "Une agence de l'ONU créée en 1945 ; la Nubie ; la liste du patrimoine mondial.",
    h: `<p>L'<a class="t" data-term="unesco">UNESCO</a> (Organisation des Nations unies pour l'éducation, la science et la culture) est une institution spécialisée de l'ONU créée en <span class="d">novembre 1945</span>. Son acte constitutif affirme : « Les guerres prenant naissance dans l'esprit des hommes, c'est dans l'esprit des hommes que doivent être élevées les défenses de la paix. »</p>
<div class="box ex"><b>Exemple à mobiliser · la Nubie</b>Le haut barrage d'Assouan menace d'engloutir les temples de Nubie. En <span class="d">1960</span>, l'UNESCO lance une campagne internationale, portée en France par André Malraux. De <span class="d">1964 à 1968</span>, les temples d'Abou Simbel sont découpés en blocs et remontés plus haut. Naît l'idée d'un patrimoine qui appartient à toute l'humanité.</div>
<p>La <a class="t" data-term="convention-1972">Convention du patrimoine mondial</a> <span class="d">1972</span> crée la <a class="t" data-term="patrimoine-mondial">Liste du patrimoine mondial</a> :</p>
<ul>
<li>elle protège des biens <b>culturels</b>, <b>naturels</b> ou <b>mixtes</b> ;</li>
<li>un bien doit avoir une <a class="t" data-term="vue">valeur universelle exceptionnelle</a> ;</li>
<li>c'est l'<b>État</b> qui propose ses biens et s'engage à les protéger ; l'<a class="t" data-term="icomos">ICOMOS</a> (culture) et l'UICN (nature) évaluent les dossiers ;</li>
<li>une <a class="t" data-term="liste-peril">Liste du patrimoine mondial en péril</a> signale les biens menacés.</li>
</ul>
<p>Premiers biens inscrits en <span class="d">1978</span> : la ville de Quito, le parc de Yellowstone, les îles Galápagos… La cathédrale de Chartres suit en <span class="d">1979</span>.</p>
<div class="box piege"><b>Attention à ne pas confondre</b>L'UNESCO ne possède pas les biens et ne les gère pas : elle les inscrit sur une liste, conseille et alerte. La protection concrète reste la responsabilité de l'État.</div>` },

  { id: "v1g", t: "L'élargissement : immatériel, paysages, patrimoine récent", sum: "Convention de 2003 ; inflation patrimoniale.",
    h: `<ul>
<li><span class="d">1992</span> : l'UNESCO reconnaît les <a class="t" data-term="paysage-culturel">paysages culturels</a>, œuvres combinées de l'homme et de la nature.</li>
<li><span class="d">2003</span> : la <a class="t" data-term="convention-2003">Convention pour la sauvegarde du patrimoine culturel immatériel</a> protège des traditions orales, des savoir-faire, des fêtes, des arts du spectacle.</li>
</ul>
<div class="exlist">
<div><span class="d">2009</span><b>Le tango</b><p>Argentine et Uruguay.</p></div>
<div><span class="d">2010</span><b>Le repas gastronomique des Français</b><p>Une pratique sociale, pas « la gastronomie ».</p></div>
<div><span class="d">2022</span><b>La baguette de pain</b><p>Savoir-faire artisanal et culture.</p></div>
</div>
<p>Le patrimoine s'étend aussi à des objets <b>récents</b> et <b>ordinaires</b> : architecture du XXe siècle, usines, cités ouvrières, gares.</p>
<p class="def"><a class="t" data-term="inflation">Inflation patrimoniale</a> : multiplication des objets reconnus comme patrimoine. Pour certains, si tout devient patrimoine, la notion perd son sens et il devient impossible de tout financer.</p>
<div class="box retenir"><b>À retenir</b>Trois élargissements à citer : du <b>matériel</b> à l'<b>immatériel</b>, du <b>monument</b> au <b>paysage</b> et à la ville, de l'<b>ancien</b> au <b>récent</b>.</div>` },

  { id: "v1h", t: "Les défis du patrimoine aujourd'hui", sum: "Authenticité, accès, financement, propriété, label UNESCO.",
    h: `<ol class="steps">
<li><b>Authenticité</b> : peut-on restaurer sans transformer ? faut-il figer un lieu ?</li>
<li><b>Accès et financement</b> : faire payer l'entrée finance l'entretien mais limite l'accès. Faut-il des tarifs différents pour les habitants et les visiteurs ?</li>
<li><b>Choisir quoi protéger</b> : face à l'inflation patrimoniale, il faut des priorités.</li>
<li><b>Propriété</b> : à qui appartient une œuvre qui a beaucoup circulé ? Au pays d'origine, au musée qui la conserve, à l'humanité ?</li>
</ol>
<p>Le <b>label UNESCO</b> est très recherché : reconnaissance internationale, attraction touristique. Mais :</p>
<ul>
<li>la liste compte plus de <b>1 200 biens</b>, dont près de la moitié en Europe et en Amérique du Nord : un <b>déséquilibre</b> que l'UNESCO cherche à corriger ;</li>
<li>le dossier est long et coûteux pour les États pauvres ;</li>
<li>il impose des contraintes : au Havre, des habitants ne peuvent pas transformer librement leur logement ;</li>
<li>un bien peut être <b>retiré</b> : Dresde <span class="d">2009</span>, à cause d'un pont moderne ; Liverpool <span class="d">2021</span>, à cause de nouveaux projets immobiliers.</li>
</ul>
<div class="box piege"><b>Attention</b>Le patrimoine mondial ne fait pas que protéger : il attire des touristes, ce qui peut menacer le bien lui-même (Venise). Le label est à double tranchant.</div>` }
  ]
},
{
  id: "v2", part: 1, n: 2, lab: "Axe 1 · Jalon 1", short: "Versailles",
  title: "Réaménager la mémoire : les usages de Versailles de l'Empire à nos jours",
  intro: "Un château construit pour le pouvoir absolu, réutilisé par chaque régime : musée de l'histoire de France, théâtre diplomatique, lieu de la République et outil de soft power.",
  sections: [
  { id: "v2a", t: "Aux origines : le château du pouvoir absolu", sum: "Louis XIII (1623), Louis XIV (1661, 1682), la galerie des Glaces.",
    h: `<ul>
<li><span class="d">1623</span> : Louis XIII fait construire un pavillon de chasse, remplacé par un petit château en 1631.</li>
<li><span class="d">1661</span> : Louis XIV lance les grands travaux, l'année où il décide de gouverner sans Premier ministre.</li>
<li><span class="d">1682</span> : la cour et le gouvernement s'installent à Versailles.</li>
</ul>
<p>Tout est conçu pour mettre en scène le pouvoir du roi : la chambre du roi au centre, la <b>galerie des Glaces</b> <span class="d">1678-1684</span> dont les peintures célèbrent ses victoires, le symbole d'Apollon, dieu du Soleil. Loin de Paris (Louis XIV a connu la Fronde), le roi surveille et domestique la noblesse.</p>
<p>En <span class="d">octobre 1789</span>, la famille royale est ramenée à Paris. Le château est vidé : son mobilier est vendu aux enchères pendant la Révolution.</p>
<div class="box nb"><b>Précisions sur la vidéo</b>Le pavillon de chasse date de Louis XIII (et non « Louis XI »). Louis XIV a 22 ans en 1661 (et non 18). La phrase « L'État, c'est moi » lui est attribuée mais il ne l'a très probablement jamais prononcée : ne la cite pas comme une vraie citation.</div>
<div class="box retenir"><b>À retenir</b>Le jalon commence à l'<b>Empire</b> : Louis XIV est le point de départ, mais le sujet porte sur ce que les régimes suivants ont fait de ce symbole de la monarchie absolue.</div>` },

  { id: "v2b", t: "De l'Empire à la Restauration : un héritage encombrant", sum: "Napoléon restaure le Grand Trianon ; Versailles reste un symbole d'Ancien Régime.",
    h: `<ul>
<li>Napoléon Ier ne s'installe pas dans le château, trop associé à la monarchie et coûteux à remeubler. Il fait réaménager le <b>Grand Trianon</b>, où il séjourne avec l'impératrice Marie-Louise.</li>
<li>Le pape Pie VII, venu pour le sacre, visite Versailles en <span class="d">janvier 1805</span>.</li>
<li>Les rois de la Restauration (Louis XVIII, Charles X) n'y reviennent pas vivre.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Au début du XIXe siècle, Versailles est un lieu sans fonction : trop monarchique pour l'Empire, trop lié à la monarchie absolue pour les rois constitutionnels. Il faut lui trouver un nouvel usage.</div>` },

  { id: "v2c", t: "1837 : Louis-Philippe crée le musée de l'Histoire de France", sum: "« À toutes les gloires de la France » : un lieu de réconciliation nationale.",
    h: `<p>Le <span class="d">10 juin 1837</span>, Louis-Philippe, « roi des Français », inaugure dans le château un <b>musée de l'Histoire de France</b>, dédié « à toutes les gloires de la France ».</p>
<ul>
<li>La <b>galerie des Batailles</b> présente de grands tableaux de victoires, de Tolbiac (Clovis) à Wagram (Napoléon).</li>
<li>Le musée met côte à côte la monarchie, la Révolution et l'Empire : il veut <b>réconcilier</b> des Français divisés par cinquante ans de révolutions.</li>
<li>Pour aménager les galeries, de nombreux appartements des courtisans sont détruits : l'usage nouveau transforme le monument.</li>
</ul>
<p>Louis-Philippe construit ainsi un <a class="t" data-term="roman-national">roman national</a> qui sert sa propre légitimité de roi citoyen. La IIIe République prolongera ce récit.</p>
<div class="box retenir"><b>À retenir</b>Transformer Versailles en musée, c'est <b>réaménager la mémoire</b> : un symbole de la monarchie absolue devient un lieu ouvert à tous, au service d'un récit national.</div>` },

  { id: "v2d", t: "Un théâtre de la diplomatie : 1871 et 1919", sum: "La proclamation de l'Empire allemand, puis le traité de Versailles.",
    h: `<div class="exlist">
<div><span class="d">18 janvier 1871</span><b>Proclamation de l'Empire allemand</b><p>Après la défaite française, Bismarck fait proclamer Guillaume Ier empereur dans la galerie des Glaces : une humiliation pour la France.</p></div>
<div><span class="d">28 juin 1919</span><b>Signature du traité de Versailles</b><p>Clemenceau choisit le même lieu : l'Allemagne vaincue signe la paix là où son empire était né.</p></div>
</div>
<p>En <span class="d">1871</span>, Versailles est aussi le siège du gouvernement de Thiers et de l'Assemblée pendant la Commune de Paris : les « Versaillais » combattent les communards.</p>
<div class="box retenir"><b>À retenir</b>Les deux dates se répondent. Le choix du lieu n'est jamais neutre : Versailles concentre le prestige de la France, on s'en sert pour humilier ou pour réparer.</div>` },

  { id: "v2e", t: "Versailles et la République : le Congrès", sum: "L'élection des présidents jusqu'en 1953, les révisions constitutionnelles aujourd'hui.",
    h: `<p>Une salle du Congrès est aménagée dans l'aile du Midi en <span class="d">1875</span>. Le <b>Congrès</b> réunit les deux assemblées du Parlement.</p>
<ul>
<li>Sous les IIIe et IVe Républiques, le Congrès élit le président de la République à Versailles. La dernière élection a lieu en <span class="d">1953</span> (René Coty).</li>
<li>Sous la Ve République, le président est élu par un collège de grands électeurs en 1958, puis au <b>suffrage universel direct</b> (réforme de 1962, première élection en 1965).</li>
<li>Aujourd'hui, le Congrès se réunit pour <b>réviser la Constitution</b> : par exemple le <span class="d">4 mars 2024</span>, pour y inscrire la liberté de recourir à l'IVG.</li>
<li>Depuis la révision de <span class="d">2008</span>, le président peut prendre la parole devant le Congrès (Nicolas Sarkozy en 2009, François Hollande après les attentats de novembre 2015).</li>
</ul>
<div class="box nb"><b>Précision sur la vidéo</b>Elle dit que le président était élu à Versailles « jusqu'en 1958 » et qu'il « fait le premier discours » de chaque Congrès. La dernière élection à Versailles est de 1953, et le discours présidentiel devant le Congrès est possible, pas systématique.</div>
<div class="box retenir"><b>À retenir</b>La République s'approprie le palais des rois : Versailles symbolise la continuité de l'État.</div>` },

  { id: "v2f", t: "Conserver et remeubler", sum: "Nolhac, Van der Kemp, mécénat : retrouver le Versailles de l'Ancien Régime.",
    h: `<ul>
<li>En <span class="d">1867</span>, l'impératrice Eugénie organise au Petit Trianon une exposition consacrée à Marie-Antoinette : la reine, très impopulaire sous la Révolution, devient une figure romantique.</li>
<li>À partir de <span class="d">1892</span>, le conservateur <b>Pierre de Nolhac</b> veut rendre au château son aspect de l'Ancien Régime.</li>
<li>Après 1950, le conservateur Gérald Van der Kemp mène une grande politique de <a class="t" data-term="remeublement">remeublement</a> : on rachète les meubles dispersés à la Révolution pour les remettre en place.</li>
<li>Le <a class="t" data-term="mecenat">mécénat</a> finance une partie des travaux : John D. Rockefeller Jr. dans les années 1920-1930, l'entreprise Vinci pour la restauration de la galerie des Glaces <span class="d">2004-2007</span>.</li>
</ul>
<div class="box piege"><b>Le paradoxe</b>Au XIXe siècle, Louis-Philippe transforme le château pour en faire un musée d'histoire. Au XXe siècle, on cherche au contraire à effacer ces transformations pour retrouver le château royal. Chaque époque choisit le passé qu'elle veut montrer.</div>
<div class="box nb"><b>Précision sur la vidéo</b>La vidéo attribue le remeublement du Petit Trianon à Louis-Philippe. Le remeublement comme politique est surtout l'œuvre des conservateurs des XIXe et XXe siècles. C'est cette version qui est retenue ici.</div>` },

  { id: "v2g", t: "Un outil de soft power", sum: "UNESCO 1979, chefs d'État, expositions, JO 2024, surtourisme.",
    h: `<p>Le palais et le parc de Versailles sont inscrits au patrimoine mondial en <span class="d">1979</span>. Le château accueille plusieurs millions de visiteurs par an (environ 8 millions avant la crise sanitaire).</p>
<div class="exlist">
<div><span class="d">2017</span><b>Emmanuel Macron reçoit Vladimir Poutine</b><p>Autour d'une exposition sur Pierre le Grand.</p></div>
<div><span class="d">depuis 2018</span><b>Sommets « Choose France »</b><p>Des patrons étrangers invités à investir en France.</p></div>
<div><span class="d">2023</span><b>Dîner d'État pour Charles III</b><p>Dans la galerie des Glaces.</p></div>
<div><span class="d">2024</span><b>Épreuves d'équitation des JO</b><p>Dans le parc du château.</p></div>
</div>
<ul>
<li>Le château expose de l'art contemporain pour ne pas rester figé : l'exposition <b>Jeff Koons</b> <span class="d">2008</span> crée une vive polémique (provocation ou dialogue entre les époques ?).</li>
<li>Spectacles, bals, Grandes Eaux musicales font revivre le XVIIe siècle, au risque d'en donner une image simplifiée.</li>
<li>La fréquentation pose les problèmes du <a class="t" data-term="surtourisme">surtourisme</a> : files d'attente, usure des parquets, saturation.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Versailles est un outil de <a class="t" data-term="soft-power">soft power</a> : la France utilise son prestige pour recevoir, séduire et négocier. Le patrimoine sert la <a class="t" data-term="diplomatie-culturelle">diplomatie</a>.</div>` }
  ]
},
{
  id: "v3", part: 1, n: 3, lab: "Axe 1 · Jalon 2", short: "Parthénon",
  title: "Conflits de patrimoine : les frises du Parthénon depuis le XIXe siècle",
  intro: "Des sculptures athéniennes exposées à Londres depuis deux siècles : un patrimoine revendiqué au nom de la nation grecque et défendu au nom de l'universalité.",
  sections: [
  { id: "v3a", t: "Le Parthénon, cœur de l'identité athénienne", sum: "Ve siècle av. J.-C., Périclès, Phidias, la frise des Panathénées, l'explosion de 1687.",
    h: `<ul>
<li>Le Parthénon est construit sur l'Acropole d'Athènes de <span class="d">447 à 432 av. J.-C.</span>, à l'initiative de <b>Périclès</b>, à l'apogée de la puissance athénienne.</li>
<li>Les architectes sont Ictinos et Callicratès ; le sculpteur <b>Phidias</b> dirige le décor sculpté.</li>
<li>Le temple est dédié à <b>Athéna Parthénos</b>, protectrice de la cité. Sa frise représente la procession des <b>Panathénées</b>, la grande fête civique d'Athènes.</li>
</ul>
<p>Le monument devient ensuite église, puis mosquée sous les Ottomans. En <span class="d">1687</span>, pendant le siège d'Athènes par les Vénitiens, un boulet fait exploser la poudre que les Ottomans y stockaient : le toit et une partie des murs s'effondrent, les sculptures se dispersent.</p>
<div class="box retenir"><b>À retenir</b>Le Parthénon est à la fois un chef-d'œuvre de l'art antique, un symbole de la démocratie athénienne et, depuis le XIXe siècle, un symbole de la nation grecque.</div>` },

  { id: "v3b", t: "1801-1816 : Lord Elgin et le départ des marbres", sum: "Un firman ottoman, la dépose, l'achat par le Parlement britannique.",
    h: `<ul>
<li><b>Lord Elgin</b> est l'ambassadeur britannique auprès de l'Empire ottoman, qui domine alors la Grèce.</li>
<li>En <span class="d">1801</span>, il dit obtenir du sultan un <a class="t" data-term="firman">firman</a> (autorisation officielle) pour dessiner et prélever des sculptures.</li>
<li>De <span class="d">1801 à 1805</span>, ses équipes déposent environ la moitié de ce qui subsiste de la frise, des métopes et des statues des frontons. Elles sont expédiées en Angleterre.</li>
<li>En <span class="d">1816</span>, Elgin, ruiné, vend la collection au Parlement britannique, qui la confie au <b>British Museum</b>.</li>
</ul>
<p>Le reste des sculptures est aujourd'hui surtout à Athènes. Quelques fragments sont dans d'autres musées, dont le Louvre (plaque des Ergastines).</p>
<div class="box piege"><b>Le point disputé</b>L'original du firman n'a jamais été retrouvé : seule une traduction italienne est connue. La légalité de l'acquisition est donc au cœur du débat.</div>
<div class="box nb"><b>Précision sur la vidéo</b>Le British Museum n'a pas « ouvert en 1753 » : il est fondé en 1753 et ouvert en 1759.</div>` },

  { id: "v3c", t: "Dès le XIXe siècle, une appropriation contestée", sum: "Byron, le philhellénisme, l'indépendance grecque.",
    h: `<ul>
<li>Le poète britannique <b>Lord Byron</b> attaque Elgin dans le chant II de <i>Childe Harold's Pilgrimage</i> <span class="d">1812</span> et dans <i>La Malédiction de Minerve</i> : il y voit un pillage.</li>
<li>Pendant la guerre d'indépendance grecque <span class="d">1821-1830</span>, l'Europe se passionne pour la Grèce (<b>philhellénisme</b>). Byron meurt à Missolonghi en 1824.</li>
<li>La Grèce est reconnue indépendante en <span class="d">1830</span> et devient un royaume. L'Acropole devient le symbole de la nouvelle nation : on la « nettoie » des ajouts ottomans pour retrouver le monument antique.</li>
</ul>
<div class="box nb"><b>Précision sur la date</b>La vidéo date le poème de Byron de 1816. Le chant II de <i>Childe Harold</i>, qui condamne Elgin, est publié en 1812.</div>
<div class="box retenir"><b>À retenir</b>Le conflit est ancien : dès le XIXe siècle, il oppose deux visions, le patrimoine comme trophée d'une grande puissance ou comme héritage d'un peuple.</div>` },

  { id: "v3d", t: "Les arguments grecs", sum: "Mélina Mercouri, un firman illégitime, le musée de l'Acropole (2009).",
    h: `<ul>
<li>En <span class="d">1982</span>, la ministre de la Culture <b>Mélina Mercouri</b> demande le retour des marbres lors d'une conférence de l'UNESCO à Mexico. La Grèce dépose une demande officielle en <span class="d">1983</span>.</li>
<li>Les Ottomans étaient une puissance d'occupation : ils n'avaient pas la légitimité de céder le patrimoine grec. Le patrimoine appartient à la <b>nation</b>, pas à l'État qui contrôle le territoire.</li>
<li>Les frises forment une œuvre <b>unique</b> : il faut la réunir dans son contexte, face au monument.</li>
<li>Le nouveau <b>musée de l'Acropole</b>, ouvert en <span class="d">2009</span>, offre d'excellentes conditions de conservation. Les parties absentes y sont représentées par des moulages blancs, bien visibles.</li>
</ul>
<p>La revendication est aussi un levier politique : elle revient en force après la dictature des colonels <span class="d">1967-1974</span>, puis pendant la crise économique des années 2010. Elle renforce la fierté nationale et le tourisme culturel.</p>
<div class="box retenir"><b>À retenir</b>Position grecque = <a class="t" data-term="nationalisme-culturel">nationalisme culturel</a> : un bien patrimonial est lié à l'identité d'un peuple et au lieu où il a été créé.</div>` },

  { id: "v3e", t: "Les arguments britanniques", sum: "Acquisition légale, British Museum Act, musée universel, peur du précédent.",
    h: `<ul>
<li>L'acquisition était <b>légale</b> : un firman de l'autorité qui gouvernait alors la Grèce.</li>
<li>La loi l'interdit : le <b>British Museum Act</b> <span class="d">1963</span> empêche le musée de céder ses collections. C'est un principe d'<a class="t" data-term="inalienabilite">inaliénabilité</a>.</li>
<li>Le British Museum se présente comme un <a class="t" data-term="musee-universel">musée universel</a>, gratuit, où l'on compare les civilisations : les marbres y appartiennent au patrimoine de l'<b>humanité</b>.</li>
<li>Elgin aurait <b>sauvé</b> des sculptures menacées. Les Grecs rappellent toutefois qu'un nettoyage abrasif au British Museum en 1937-1938 les a abîmées.</li>
<li>Rendre les marbres créerait un <b>précédent</b> : l'Égypte réclame la pierre de Rosette, l'Inde le diamant Koh-i-Noor, l'Éthiopie des objets sacrés pris à Magdala en 1868.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Position britannique = <a class="t" data-term="universalisme">universalisme</a> patrimonial : un chef-d'œuvre appartient à l'humanité et peut être conservé loin de son lieu d'origine.</div>` },

  { id: "v3f", t: "Un conflit en voie de résolution ?", sum: "UNESCO, retours italiens (2022-2023), négociations avec le British Museum.",
    h: `<ul>
<li>La Grèce porte l'affaire devant le comité intergouvernemental de l'UNESCO pour le retour des biens culturels depuis <span class="d">1984</span>. En <span class="d">2021</span>, ce comité invite le Royaume-Uni à reconsidérer sa position.</li>
<li>En <span class="d">2022</span>, un musée de Palerme rend à Athènes un fragment de la frise. En <span class="d">2023</span>, le Vatican restitue trois fragments.</li>
<li>Depuis 2022-2023, le British Museum et la Grèce discutent d'un « partenariat » : un <b>prêt de longue durée</b> en échange d'autres œuvres grecques, qui permettrait de contourner l'inaliénabilité sans transférer la propriété. Fin 2024, le Premier ministre Keir Starmer rencontre Kyriakos Mitsotakis. Aucun accord définitif n'est conclu à la date des sources utilisées.</li>
</ul>
<div class="box nb"><b>Information écartée</b>La vidéo attribue à Boris Johnson, en 2019, une proposition d'« itinérance » des marbres. Cette proposition n'a pas pu être vérifiée : elle n'est pas reprise ici. Boris Johnson a au contraire déclaré en 2021 que la question relevait du British Museum.</div>
<div class="box piege"><b>Attention à ne pas confondre</b>Un <b>prêt</b> laisse la propriété au musée prêteur. Une <a class="t" data-term="restitution">restitution</a> transfère la propriété au pays d'origine. La Grèce réclame une restitution.</div>` },

  { id: "v3g", t: "Un débat plus large : les restitutions", sum: "Washington (1998), UNESCO (1970), rapport Sarr-Savoy (2018), lois françaises.",
    h: `<div class="exlist">
<div><span class="d">1970</span><b>Convention UNESCO contre le trafic illicite</b><p>Lutte contre l'exportation illégale des biens culturels.</p></div>
<div><span class="d">1998</span><b>Principes de Washington</b><p>Restituer les œuvres spoliées par les nazis.</p></div>
<div><span class="d">2018</span><b>Rapport Sarr-Savoy</b><p>Commandé après le discours d'Emmanuel Macron à Ouagadougou (2017) : il recommande de restituer les biens africains pris sans consentement pendant la colonisation.</p></div>
<div><span class="d">2020</span><b>Loi de restitution</b><p>26 objets du trésor d'Abomey rendus au Bénin (2021), le sabre dit d'El Hadj Omar au Sénégal.</p></div>
</div>
<p>En France comme au Royaume-Uni, les collections publiques sont <a class="t" data-term="inalienabilite">inaliénables</a> : chaque restitution exige une loi. En 2023, des lois-cadres facilitent les restitutions de biens spoliés pendant la période nazie et de restes humains.</p>
<div class="box retenir"><b>À retenir</b>Le Parthénon est un cas d'école : il oppose légalité et justice historique, nation et humanité, et pose la question « à qui appartient le patrimoine ? ».</div>` }
  ]
},
{
  id: "v4", part: 2, n: 4, lab: "Axe 2 · Jalon 1", short: "Paris",
  title: "Paris, entre protection et nouvel urbanisme",
  intro: "Une ville-musée et une métropole de 13 millions d'habitants : comment protéger un patrimoine exceptionnel sans empêcher la ville de vivre et de se transformer ?",
  sections: [
  { id: "v4a", t: "Paris, ville-patrimoine et métropole", sum: "Rives de la Seine (1991), patrimoine immatériel, aire d'attraction de 13 millions d'habitants.",
    h: `<ul>
<li>Les <b>rives de la Seine</b> sont inscrites au patrimoine mondial en <span class="d">1991</span> : de Notre-Dame à la tour Eiffel, elles montrent l'évolution de la ville du Moyen Âge au XIXe siècle.</li>
<li>Paris a aussi un patrimoine <b>immatériel</b> : la culture de la baguette <span class="d">2022</span>, les savoir-faire des couvreurs-zingueurs et ornemanistes parisiens <span class="d">2024</span>.</li>
<li>Mais Paris est aussi le cœur d'une <b>métropole</b> : son aire d'attraction compte environ 13 millions d'habitants. Il faut se loger, se déplacer, travailler.</li>
</ul>
<div class="box piege"><b>Deux risques à nommer</b>La <a class="t" data-term="museification">muséification</a> : la ville se fige et ses habitants partent. La <a class="t" data-term="patrimondialisation">patrimondialisation</a> : la ville se met en scène pour les touristes du monde entier selon des codes standardisés (le Paris « carte postale »).</div>` },

  { id: "v4b", t: "Une ville qui s'est toujours transformée", sum: "Haussmann, la tour Eiffel, Beaubourg, la Pyramide : la modernité d'hier devient patrimoine.",
    h: `<ul>
<li>Sous le Second Empire, les travaux du préfet <b>Haussmann</b> <span class="d">1853-1870</span> détruisent une grande partie du Paris médiéval. L'immeuble haussmannien est aujourd'hui le symbole du patrimoine parisien.</li>
<li>La <b>tour Eiffel</b> <span class="d">1889</span> est violemment contestée par des artistes en 1887 ; elle devient l'emblème de Paris.</li>
<li>Le <b>Centre Pompidou</b> <span class="d">1977</span> et la <b>pyramide du Louvre</b> <span class="d">1989</span> font scandale avant d'être admirés.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Le patrimoine d'aujourd'hui est souvent la modernité contestée d'hier. Transformer la ville n'est pas forcément détruire le patrimoine : cela peut en créer.</div>` },

  { id: "v4c", t: "Les Trente Glorieuses et la réaction patrimoniale", sum: "Voies sur berges, Halles, tour Montparnasse ; loi Malraux (1962) et Marais (1964).",
    h: `<p>Dans les années 1960-1970, on modernise Paris pour la voiture et les bureaux :</p>
<ul>
<li>voie express rive droite <span class="d">1967</span> ;</li>
<li>destruction des pavillons Baltard des Halles <span class="d">1971</span> ;</li>
<li>tour Montparnasse <span class="d">1973</span>, 210 m : son impact conduit à limiter la hauteur des immeubles dans le centre de Paris.</li>
</ul>
<p>En réaction, la protection se renforce :</p>
<div class="exlist">
<div><span class="d">1962</span><b>Loi Malraux</b><p>Crée les <a class="t" data-term="secteur-sauvegarde">secteurs sauvegardés</a> : on protège des quartiers entiers, pas seulement des monuments.</p></div>
<div><span class="d">1964</span><b>Le Marais</b><p>Premier secteur sauvegardé de Paris.</p></div>
</div>
<ul>
<li>Avantage : le paysage urbain est préservé.</li>
<li>Limites : travaux plus chers et encadrés ; le Marais restauré se <a class="t" data-term="gentrification">gentrifie</a> et ses habitants modestes partent.</li>
</ul>
<div class="box nb"><b>Précision</b>Depuis la loi de 2016 (LCAP), les secteurs sauvegardés sont devenus des « sites patrimoniaux remarquables ».</div>` },

  { id: "v4d", t: "Restaurer, réhabiliter, rénover", sum: "Notre-Dame, la Cité de la mode et du design, la tour Triangle.",
    h: `<div class="vs">
<div><span class="lab">Restaurer</span><p>Rendre à un bâtiment un état antérieur, sans changer son usage. <b>Notre-Dame</b> après 2019 : flèche de Viollet-le-Duc à l'identique, techniques anciennes.</p></div>
<div><span class="lab">Réhabiliter</span><p>Garder la structure et l'esprit d'un bâtiment, mais lui donner un <b>nouvel usage</b>. Les docks d'Austerlitz (entrepôts de 1907) deviennent la <b>Cité de la mode et du design</b> <span class="d">2012</span>.</p></div>
</div>
<p><a class="t" data-term="renovation">Rénover</a>, c'est transformer profondément, voire démolir pour reconstruire. Exemple : la <b>tour Triangle</b> (180 m, 15e arrondissement), en chantier depuis 2021, très contestée dans une ville traditionnellement basse.</p>
<p>On peut garder des traces du passé dans un projet neuf : dans l'écoquartier des <b>Docks de Saint-Ouen</b>, bâti sur une friche industrielle, la halle Alstom est conservée.</p>
<div class="box piege"><b>Débat à Notre-Dame</b>Le projet de remplacer des vitraux du XIXe siècle par des créations contemporaines oppose ceux qui veulent marquer notre époque et ceux qui défendent l'état restauré par Viollet-le-Duc.</div>
<div class="box nb"><b>Précision sur la vidéo</b>Elle parle des « docks de Bercy » et d'« entrepôts du XIXe siècle » : il s'agit des docks d'Austerlitz, bâtis en 1907.</div>` },

  { id: "v4e", t: "Conflits d'aménagement et conflits d'usage", sum: "Berges piétonnes, touristes contre habitants, vie nocturne.",
    h: `<p class="def"><a class="t" data-term="conflit-amenagement">Conflit d'aménagement</a> : opposition entre acteurs autour d'un projet d'aménagement (sa conception, sa réalisation).</p>
<div class="box ex"><b>Exemple · les voies sur berges</b>La rive gauche est rendue aux piétons en <span class="d">2013</span>, la rive droite en <span class="d">2016</span>. Gain : promenades, vue dégagée sur les monuments, moins de pollution. Mais les automobilistes de banlieue perdent du temps : décision attaquée en justice, puis confirmée. Le conflit oppose la ville-centre et la métropole.</div>
<p class="def"><a class="t" data-term="conflit-usage">Conflit d'usage</a> : tension entre des acteurs qui utilisent le même espace de façons différentes.</p>
<ul>
<li>Touristes et habitants à Montmartre ou dans le Marais : foule, locations touristiques qui font monter les loyers.</li>
<li>Vie nocturne et terrasses contre le sommeil des riverains : horaires et normes sonores.</li>
</ul>
<div class="box nb"><b>Information écartée</b>La vidéo présente les terrasses de café comme un patrimoine parisien : c'est un avis personnel du vidéaste. Les terrasses ne sont pas un patrimoine protégé.</div>` },

  { id: "v4f", t: "Valoriser : événements et Jeux olympiques de 2024", sum: "Nuit blanche, Journées du patrimoine, sites patrimoniaux des JO.",
    h: `<ul>
<li>L'événementiel valorise le patrimoine pour les habitants comme pour les touristes : <b>Nuit blanche</b> (depuis 2002), Nuit européenne des musées, Journées européennes du patrimoine.</li>
<li>Les <b>JO de 2024</b> utilisent des monuments plutôt que de construire des équipements neufs : cérémonie d'ouverture sur la Seine <span class="d">26 juillet 2024</span>, escrime au Grand Palais restauré, équitation à Versailles, tir à l'arc aux Invalides, triathlon et nage en eau libre dans la Seine.</li>
<li>Les images diffusées dans le monde entier font du patrimoine un instrument d'<a class="t" data-term="rayonnement">attractivité</a>.</li>
</ul>
<div class="box retenir"><b>À retenir</b>Paris montre que protection et modernité peuvent se combiner, mais au prix de compromis permanents entre habitants, touristes, élus, État, architectes et défenseurs du patrimoine.</div>` }
  ]
},
{
  id: "v5", part: 2, n: 5, lab: "Axe 2 · Jalon 2", short: "Mali",
  title: "La destruction, la protection et la restauration du patrimoine, enjeu géopolitique : la question patrimoniale au Mali",
  intro: "Quand le patrimoine devient une cible : les destructions de Tombouctou en 2012, la mobilisation internationale, le procès Al Mahdi et la reconstruction des mausolées.",
  sections: [
  { id: "v5a", t: "Un patrimoine riche, au carrefour des cultures", sum: "Empires ouest-africains, commerce transsaharien, quatre biens UNESCO.",
    h: `<ul>
<li>Le territoire malien a été le cœur des empires du <b>Ghana</b>, du <b>Mali</b> et <b>songhaï</b>, enrichis par le commerce transsaharien (or, sel, livres).</li>
<li><b>Tombouctou</b> est aux XVe-XVIe siècles un grand centre religieux et intellectuel : mosquées en terre (Djingareyber, Sankoré, Sidi Yahia), mausolées de saints, milliers de <b>manuscrits</b>.</li>
<li>Les <b>mausolées</b> abritent les tombes de saints musulmans vénérés par la population, dans une tradition soufie qui mêle islam et pratiques locales.</li>
</ul>
<div class="exlist">
<div><span class="d">1988</span><b>Tombouctou</b><p>Patrimoine mondial.</p></div>
<div><span class="d">1988</span><b>Villes anciennes de Djenné</b><p>Grande mosquée en terre.</p></div>
<div><span class="d">1989</span><b>Falaises de Bandiagara</b><p>Pays dogon, bien mixte (culturel et naturel).</p></div>
<div><span class="d">2004</span><b>Tombeau des Askia (Gao)</b><p>Empire songhaï.</p></div>
</div>` },

  { id: "v5b", t: "2012 : la guerre et les destructions", sum: "Rébellion touarègue, coup d'État, groupes djihadistes, 14 mausolées détruits.",
    h: `<div class="exlist">
<div><span class="d">janvier 2012</span><b>Rébellion touarègue dans le Nord</b><p>Le MNLA réclame l'indépendance de l'Azawad.</p></div>
<div><span class="d">mars 2012</span><b>Coup d'État à Bamako</b><p>L'armée renverse le président.</p></div>
<div><span class="d">avril 2012</span><b>Le Nord aux mains des groupes armés</b><p>Les djihadistes d'Ansar Dine, d'AQMI et du MUJAO prennent vite le dessus sur les rebelles touaregs.</p></div>
<div><span class="d">à partir de juin 2012</span><b>Destructions à Tombouctou</b><p>14 des 16 mausolées inscrits sont détruits, la porte sacrée de la mosquée Sidi Yahia est brisée.</p></div>
</div>
<p>Pourquoi ? Pour ces groupes <b>salafistes</b>, le culte des saints est une idolâtrie : détruire les mausolées est un acte d'<a class="t" data-term="iconoclasme">iconoclasme</a>. C'est aussi un message politique : défier l'UNESCO et la communauté internationale en filmant les destructions.</p>
<p>En <span class="d">janvier 2013</span>, en fuyant Tombouctou, les djihadistes incendient une partie des manuscrits conservés à l'institut Ahmed Baba.</p>
<div class="box nb"><b>Corrections</b>La vidéo écrit que le coup d'État a précédé la rébellion : c'est l'inverse (rébellion en janvier, coup d'État en mars, en partie à cause des défaites de l'armée). Elle parle de « 14 mausolées sur 18 » : ce sont 14 sur 16. Les manuscrits n'étaient pas dans les mausolées, mais dans des bibliothèques familiales et à l'institut Ahmed Baba.</div>` },

  { id: "v5c", t: "Détruire le patrimoine pour effacer un peuple", sum: "Urbicide, iconoclasme : le patrimoine comme cible.",
    h: `<p>La géographe Bénédicte Tratnjek, qui a étudié les villes en guerre (ex-Yougoslavie), montre que détruire les traces culturelles d'un groupe, c'est nier sa présence et sa légitimité sur un territoire.</p>
<p class="def"><a class="t" data-term="urbicide">Urbicide</a> : violence qui vise la ville non comme objectif militaire, mais comme lieu d'identité et de vie commune, pour la détruire en tant que telle.</p>
<div class="exlist">
<div><span class="d">1993</span><b>Pont de Mostar (Bosnie)</b><p>Détruit pendant la guerre, reconstruit, patrimoine mondial en 2005.</p></div>
<div><span class="d">2001</span><b>Bouddhas de Bamiyan (Afghanistan)</b><p>Dynamités par les talibans.</p></div>
<div><span class="d">2015</span><b>Palmyre (Syrie)</b><p>Temples détruits par l'État islamique.</p></div>
</div>
<div class="box retenir"><b>À retenir</b>Une attaque contre le patrimoine est une attaque contre l'<b>identité</b> d'un peuple. C'est pourquoi le patrimoine devient un enjeu géopolitique.</div>` },

  { id: "v5d", t: "Protéger : le droit et les acteurs", sum: "Convention de La Haye (1954), bouclier bleu, liste en péril, Serval, MINUSMA, habitants.",
    h: `<ul>
<li>La <a class="t" data-term="la-haye">Convention de La Haye</a> <span class="d">1954</span> protège les biens culturels en cas de conflit armé. Son emblème est le <a class="t" data-term="bouclier-bleu">bouclier bleu</a>.</li>
<li>Le <span class="d">28 juin 2012</span>, à la demande du Mali, Tombouctou et le tombeau des Askia sont inscrits sur la <a class="t" data-term="liste-peril">liste du patrimoine en péril</a>. Les destructions commencent quelques jours plus tard.</li>
<li>En <span class="d">janvier 2013</span>, l'intervention militaire française (<b>opération Serval</b>) chasse les groupes armés de Tombouctou.</li>
<li>La <a class="t" data-term="minusma">MINUSMA</a>, mission de l'ONU créée en <span class="d">2013</span>, est la première opération de maintien de la paix chargée de protéger le patrimoine culturel. Elle quitte le Mali fin 2023, à la demande de la junte au pouvoir.</li>
<li>Les <b>habitants</b> et l'ONG SAVAMA-DCI (Abdel Kader Haïdara) évacuent en secret la grande majorité des manuscrits vers Bamako.</li>
</ul>
<div class="box nb"><b>Précision sur la vidéo</b>Elle dit que Tombouctou et Djenné ont été placés « en péril » en 2012. En 2012, ce sont Tombouctou et le tombeau des Askia (Gao). Djenné est inscrit sur la liste en péril en 2016.</div>` },

  { id: "v5e", t: "Juger : le procès Al Mahdi (2016)", sum: "Cour pénale internationale, 9 ans de prison, crime de guerre.",
    h: `<p><b>Ahmad Al Faqi Al Mahdi</b>, membre d'Ansar Dine qui dirigeait la police islamique de Tombouctou, est jugé par la <a class="t" data-term="cpi">Cour pénale internationale</a>.</p>
<ul>
<li>Il plaide coupable. Le <span class="d">27 septembre 2016</span>, il est condamné à <b>9 ans de prison</b> pour la destruction de mausolées et de la porte de Sidi Yahia.</li>
<li>C'est le premier procès de la CPI consacré uniquement à la destruction de patrimoine, jugée comme un <a class="t" data-term="crime-guerre">crime de guerre</a>.</li>
<li>En <span class="d">2017</span>, la CPI ordonne des réparations (2,7 millions d'euros) pour la communauté de Tombouctou.</li>
</ul>
<div class="box nb"><b>Nuance</b>La vidéo dit que c'est la première condamnation qui fait de la destruction du patrimoine un crime de guerre. C'était déjà un crime de guerre dans le statut de Rome (1998), et le tribunal pour l'ex-Yougoslavie avait déjà jugé le bombardement de Dubrovnik. La nouveauté est un procès centré uniquement sur ce crime, devant la CPI.</div>
<div class="box retenir"><b>À retenir</b>Le message : détruire le patrimoine n'est plus impuni. Le patrimoine entre dans le droit pénal international.</div>` },

  { id: "v5f", t: "Reconstruire : authenticité et résilience", sum: "Mausolées reconstruits en 2014-2015 avec les maçons locaux ; enjeux politiques.",
    h: `<ul>
<li>De <span class="d">2014 à 2015</span>, les mausolées sont reconstruits avec l'UNESCO, en terre crue, selon les techniques traditionnelles, par les maçons de Tombouctou. Ils sont reconsacrés en <span class="d">2016</span>.</li>
<li>La reconstruction suit les principes de la <a class="t" data-term="charte-venise">charte de Venise</a> <span class="d">1964</span> et de l'<a class="t" data-term="icomos">ICOMOS</a> : respecter les matériaux et les techniques d'origine pour garder l'<a class="t" data-term="authenticite">authenticité</a>.</li>
<li>La reconstruction transmet les savoir-faire, rapproche les communautés et aide à surmonter le traumatisme : c'est la <b>résilience</b>.</li>
<li>Elle a un enjeu <b>politique</b> : l'État malien montre qu'il revient dans le Nord. Et un enjeu <b>économique</b> : le tourisme, presque disparu à cause de l'insécurité.</li>
</ul>
<div class="box piege"><b>Limites</b>L'insécurité continue, l'État malien reste fragile (coups d'État de 2020 et 2021), la MINUSMA est partie en 2023. Le patrimoine restauré reste menacé.</div>
<div class="box retenir"><b>À retenir</b>Le Mali montre les trois temps du jalon : <b>destruction</b> (2012), <b>protection</b> (droit, MINUSMA, habitants), <b>restauration</b> (2014-2016). Il montre aussi la coopération entre acteurs locaux, nationaux et internationaux.</div>` }
  ]
},
{
  id: "v6", part: 2, n: 6, lab: "Axe 2 · Jalon 3", short: "Venise",
  title: "Le tourisme culturel, entre valorisation et protection : Venise",
  intro: "Une ville menacée par l'eau et par le succès de son propre patrimoine : le surtourisme vide la ville de ses habitants. Que peuvent faire la municipalité, l'État italien et l'UNESCO ?",
  sections: [
  { id: "v6a", t: "Une ville-patrimoine unique et fragile", sum: "Venise et sa lagune (UNESCO 1987), l'eau, l'inondation de 1966.",
    h: `<ul>
<li>Venise est bâtie sur des îles d'une lagune. Ancienne capitale d'une puissante république marchande, elle concentre palais, églises, canaux et œuvres d'art.</li>
<li>« Venise et sa lagune » est inscrite au patrimoine mondial en <span class="d">1987</span>.</li>
<li>La ville est menacée par l'<b>acqua alta</b> (les hautes eaux), l'enfoncement du sol et la montée du niveau de la mer.</li>
</ul>
<div class="box ex"><b>Exemple à mobiliser</b>Le <span class="d">4 novembre 1966</span>, une inondation exceptionnelle (194 cm) frappe Venise et Florence. L'UNESCO lance une campagne internationale pour sauver Venise : la ville devient un enjeu mondial.</div>` },

  { id: "v6b", t: "Le surtourisme", sum: "Des millions de visiteurs, moins de 50 000 habitants dans le centre.",
    h: `<ul>
<li>Venise reçoit chaque année des millions de visiteurs : les estimations varient, souvent autour de 20 à 30 millions. Beaucoup sont des <b>excursionnistes</b> qui viennent pour la journée, dépensent peu et saturent les rues.</li>
<li>Les grands navires de croisière déversent des milliers de passagers à la fois et menacent la lagune.</li>
<li>Le centre historique comptait environ 175 000 habitants en 1951. Il passe sous les <b>50 000</b> en <span class="d">2022</span>.</li>
<li>Les logements deviennent des locations touristiques, les commerces du quotidien sont remplacés par des boutiques de souvenirs.</li>
</ul>
<p class="def"><a class="t" data-term="surtourisme">Surtourisme</a> : situation où l'afflux de touristes dépasse ce qu'un lieu peut supporter, au détriment des habitants, de l'environnement et du patrimoine lui-même.</p>
<div class="box retenir"><b>Le paradoxe</b>Le patrimoine attire les touristes ; les touristes font vivre la ville ; mais leur nombre menace le patrimoine et fait fuir les habitants. Venise risque de devenir une <a class="t" data-term="museification">ville-musée</a> sans Vénitiens.</div>` },

  { id: "v6c", t: "Des acteurs aux intérêts divergents", sum: "Municipalité, habitants, État italien, UNESCO, croisiéristes, commerçants.",
    h: `<ul>
<li><b>La municipalité</b> a besoin des revenus du tourisme, mais doit garder la ville habitable.</li>
<li><b>Les habitants</b> et leurs associations (comme le mouvement « No Grandi Navi ») dénoncent la dépossession de leur ville.</li>
<li><b>L'État italien</b> décide de certaines mesures, comme l'interdiction des grands navires.</li>
<li><b>L'UNESCO</b> alerte et menace d'inscrire Venise sur la liste du patrimoine en péril.</li>
<li><b>Les compagnies de croisière, hôteliers, commerçants, plateformes de location</b> vivent du tourisme.</li>
<li><b>Les touristes</b> veulent un accès libre.</li>
</ul>

{ id: "c19", p: 1, df: 2, q: "Quels gestes récents ont fait avancer la question du Parthénon ?", a: "Fragment rendu par Palerme (2022), trois fragments rendus par le Vatican (2023), négociations du British Museum sur un prêt de longue durée." },
{ id: "c20", p: 1, df: 2, q: "Que recommande le rapport Sarr-Savoy (2018) ?", a: "La restitution des biens culturels africains pris sans consentement pendant la colonisation. Il mène à la loi de 2020 (Bénin, Sénégal)." },
{ id: "c21", p: 2, df: 1, q: "Que crée la loi Malraux de 1962 ?", a: "Les secteurs sauvegardés : des quartiers entiers protégés. Le Marais est le premier à Paris (1964)." },
{ id: "c22", p: 2, df: 1, q: "Restauration, réhabilitation, rénovation : quel exemple parisien pour chacune ?", a: "Restauration : Notre-Dame après 2019. Réhabilitation : Cité de la mode et du design (docks d'Austerlitz). Rénovation : Halles de Baltard démolies (1971), tour Triangle." },
{ id: "c23", p: 2, df: 2, q: "Pourquoi la piétonnisation des berges de Seine est-elle un conflit d'aménagement ?", a: "Elle valorise le patrimoine et réduit la pollution pour les Parisiens, mais allonge les trajets des automobilistes de banlieue : un projet oppose la ville-centre et la métropole." },
{ id: "c24", p: 2, df: 2, q: "Comment les JO de 2024 utilisent-ils le patrimoine ?", a: "Cérémonie sur la Seine, escrime au Grand Palais, équitation à Versailles, tir à l'arc aux Invalides : le patrimoine sert de décor et de vitrine." },
{ id: "c25", p: 2, df: 1, q: "Quels sont les quatre biens maliens du patrimoine mondial ?", a: "Tombouctou (1988), villes anciennes de Djenné (1988), falaises de Bandiagara (1989), tombeau des Askia à Gao (2004)." },
{ id: "c26", p: 2, df: 2, q: "Dans quel ordre se déroulent les événements de 2012 au Mali ?", a: "Janvier : rébellion touarègue. Mars : coup d'État. Avril : les djihadistes contrôlent le Nord. Fin juin : inscription en péril puis destructions des mausolées." },
{ id: "c27", p: 2, df: 1, q: "Pourquoi les djihadistes détruisent-ils les mausolées de Tombouctou ?", a: "Pour eux, le culte des saints soufis est une idolâtrie (iconoclasme). C'est aussi un défi lancé à l'UNESCO et une manière d'effacer une identité." },
{ id: "c28", p: 2, df: 1, q: "Quel est le verdict du procès Al Mahdi ?", a: "La CPI le condamne en 2016 à 9 ans de prison pour la destruction des mausolées, jugée comme crime de guerre." },
{ id: "c29", p: 2, df: 2, q: "Comment les mausolées de Tombouctou ont-ils été reconstruits ?", a: "En 2014-2015, avec l'UNESCO, en terre crue, par les maçons locaux et selon les techniques traditionnelles (charte de Venise). Reconsécration en 2016." },
{ id: "c30", p: 2, df: 1, q: "Quelles mesures Venise prend-elle contre le surtourisme ?", a: "Interdiction des grands navires dans le centre (2021), contribution d'accès de 5 € pour les visiteurs d'un jour (2024), groupes limités à 25 personnes." },
{ id: "c31", p: 2, df: 2, q: "Qu'est-ce que le MOSE ?", a: "Un système de digues mobiles qui ferme la lagune lors des hautes eaux, utilisé pour la première fois en octobre 2020." },
{ id: "c32", p: 2, df: 2, q: "Combien d'habitants compte le centre historique de Venise ?", a: "Moins de 50 000 depuis 2022, contre environ 175 000 en 1951." },
{ id: "c33", p: 2, df: 2, q: "Que s'est-il passé entre Venise et l'UNESCO en 2021 et 2023 ?", a: "Les experts recommandent d'inscrire Venise sur la liste en péril ; le Comité refuse les deux fois (en 2021 après l'interdiction des grands navires)." },
{ id: "c34", p: 2, df: 1, q: "Qu'est-ce que la loi de 1913 ?", a: "La loi sur les monuments historiques : elle organise le classement et l'inscription, y compris des biens privés. C'est la base de la protection en France." },
{ id: "c35", p: 2, df: 2, q: "Quels nouveaux acteurs participent à la protection du patrimoine en France ?", a: "Collectivités territoriales (décentralisation), Fondation du patrimoine (1996), mécènes, Loto du patrimoine (2018), associations, donateurs." },
{ id: "c36", p: 2, df: 1, q: "Quand le bassin minier du Nord-Pas-de-Calais est-il inscrit au patrimoine mondial, et à quel titre ?", a: "Le 30 juin 2012, comme paysage culturel évolutif vivant." },
{ id: "c37", p: 2, df: 2, q: "Qu'a exactement inscrit l'UNESCO en 2010 pour la France ?", a: "Le repas gastronomique des Français, une pratique sociale. Pas « la gastronomie française »." },
{ id: "c38", p: 2, df: 2, q: "Cite trois exemples de patrimoine au service de la diplomatie française.", a: "Louvre Abou Dabi (2017), ALIPH (2017), restitutions au Bénin (loi de 2020), prêt de la tapisserie de Bayeux annoncé en 2025." },
{ id: "c39", p: 2, df: 3, q: "Pourquoi le label UNESCO est-il à double tranchant ?", a: "Il apporte prestige et touristes, mais impose des contraintes (Le Havre), coûte cher pour les pays pauvres et peut provoquer le surtourisme qui menace le bien (Venise)." },
{ id: "c40", p: 2, df: 3, q: "Pourquoi la reconstruction des mausolées est-elle aussi politique ?", a: "L'État malien montre qu'il revient dans le Nord ; la communauté internationale montre que la destruction est inutile ; les communautés se rassemblent autour d'un patrimoine partagé." }
];

{ id: "df1", c: "def", t: "tf", q: "Le patrimoine ne concerne que des monuments anciens.", a: false, e: "Faux : il comprend aussi le patrimoine immatériel (pratiques, savoir-faire), naturel, industriel et même récent (Le Havre reconstruit après 1945)." },
{ id: "df2", c: "def", t: "short", q: "Comment appelle-t-on le processus par lequel un objet ou un lieu devient patrimoine ?", acc: ["patrimonialisation"], s: "La patrimonialisation", e: "Elle passe par la sélection, la reconnaissance, la conservation et la mise en valeur." },
{ id: "df3", c: "def", t: "mcq", q: "Le patrimoine culturel immatériel, c'est :", o: ["Des pratiques, savoir-faire et traditions vivantes transmis entre générations", "Des monuments disparus dont il ne reste que des archives", "Des œuvres numérisées et visibles en ligne", "Des biens qui n'ont aucune valeur marchande"], a: 0, e: "Exemples : le tango (2009), le repas gastronomique des Français (2010), la baguette (2022). Convention de l'UNESCO de 2003." },

{ id: "df5", c: "def", t: "match", q: "Associe chaque notion à sa définition.", p: [["Muséification", "La ville se fige et se vide de ses habitants"], ["Surtourisme", "Afflux de visiteurs supérieur à ce que le lieu peut supporter"], ["Gentrification", "Arrivée de populations aisées qui chasse les habitants modestes"], ["Patrimondialisation", "Standardisation du patrimoine pour un public mondial"]], e: "Quatre risques liés à la valorisation du patrimoine urbain (Paris, Venise)." },
{ id: "df6", c: "def", t: "short", q: "Quel principe juridique interdit de vendre ou de céder les biens des collections publiques ?", acc: ["inalienabilite", "l inalienabilite"], s: "L'inaliénabilité", e: "C'est pourquoi la France doit voter une loi pour chaque restitution, et pourquoi le British Museum ne peut pas céder les marbres." },
{ id: "df7", c: "def", t: "mcq", q: "Un conflit d'usage, c'est :", o: ["Une tension entre acteurs qui utilisent le même espace de façons différentes", "Une opposition autour d'un projet de construction", "Un conflit armé autour d'un site patrimonial", "Un désaccord juridique entre deux États sur un objet"], a: 0, e: "Exemple : touristes contre habitants à Venise. L'opposition à un projet de construction est un conflit d'aménagement." },
{ id: "df8", c: "def", t: "short", q: "Quel mot désigne la destruction d'images ou de lieux de culte pour des raisons religieuses ?", acc: ["iconoclasme"], s: "L'iconoclasme", e: "C'est la justification des djihadistes à Tombouctou en 2012 : le culte des saints est jugé idolâtre." },
{ id: "df9", c: "def", t: "tf", q: "Le soft power désigne la capacité d'un État à imposer sa volonté par la force militaire.", a: false, e: "Faux : c'est la capacité d'influencer par l'attraction (culture, image, valeurs). Le patrimoine en est une ressource." },
{ id: "df10", c: "def", t: "mcq", q: "Un paysage culturel, selon l'UNESCO, c'est :", o: ["Un paysage façonné par l'action combinée de l'homme et de la nature", "Un paysage naturel resté intact", "Un tableau représentant un paysage célèbre", "Le décor d'une ville patrimoniale"], a: 0, e: "Reconnu depuis 1992. Exemple : le bassin minier du Nord-Pas-de-Calais (2012), paysage culturel évolutif vivant." },
{ id: "df11", c: "def", t: "short", q: "Comment appelle-t-on l'autorisation officielle du sultan ottoman invoquée par Lord Elgin ?", acc: ["firman"], s: "Un firman", e: "L'original n'a jamais été retrouvé : seule une traduction italienne est connue." },
{ id: "df12", c: "def", t: "tf", q: "L'authenticité signifie qu'un bâtiment doit avoir l'air ancien.", a: false, e: "Faux : c'est la fidélité aux matériaux, aux formes et aux techniques d'origine. Une reconstruction peut être authentique si elle respecte ces techniques (Tombouctou)." },

(function () {
"use strict";
/* ================= utilitaires ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const view = $("#view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’'\-]/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), 1600); }

/* ================= sauvegarde ================= */
