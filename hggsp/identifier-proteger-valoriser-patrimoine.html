const blank = () => ({ read: {}, gloss: {}, cards: {}, quiz: {}, qs: {}, bac: {}, drafts: {}, distBest: 0 });
let S = blank();
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(blank(), JSON.parse(r)); } catch (e) { }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } updateRail(); }

/* ================= index ================= */
const GBY = {}; GLOSS.forEach(g => GBY[g.id] = g);
const EBY = {}; EVENTS.forEach(e => EBY[e.id] = e);
const SECS = []; COURSE.forEach(v => v.sections.forEach((s, i) => SECS.push(Object.assign({}, s, { v: v.id, letter: "ABCDEFGHI"[i] }))));
const partOfCat = { notions: 1, usages: 1, protection: 2, ville: 2, france: 2 };
const CARDS = GLOSS.map(g => ({ id: "g-" + g.id, q: "Que désigne : " + g.n + " ?", a: g.d, p: partOfCat[g.c], df: g.diff || 2, src: "Glossaire" }))
  .concat(CUSTOM_CARDS.map(c => Object.assign({ src: "Cours" }, c)));
const partKey = p => p === 1 ? "war" : "peace";
const partName = p => p === 1 ? "I · Usages" : "II · Préservation";

/* ---- questions générées (pour varier les séries) ---- */
const GENQ = [];
GLOSS.forEach(g => { GENQ.push({ id: "gd-" + g.id, c: "def", t: "mcq", gen: "defA", term: g.id }); GENQ.push({ id: "gd2-" + g.id, c: "def", t: "mcq", gen: "defB", term: g.id }); });
EVENTS.forEach(e => {
  GENQ.push({ id: "gt-" + e.id, c: "dates", t: "mcq", gen: "dateA", ev: e.id });
  GENQ.push({ id: "gt2-" + e.id, c: "dates", t: "mcq", gen: "dateB", ev: e.id });
  if (e.n.length) GENQ.push({ id: "gx-" + e.id, c: "exemples", t: "mcq", gen: "exA", ev: e.id });
});
DIST.forEach(d => d.items.forEach((it, i) => GENQ.push({ id: "gs-" + d.id + "-" + i, c: "dist", t: "mcq", gen: "distA", dist: d.id, idx: i })));
const ALLQ = QBANK.concat(GENQ);
const QBY = {}; ALLQ.forEach(q => QBY[q.id] = q);
const AVOID = { "soft-power": ["rayonnement", "diplomatie-culturelle"], rayonnement: ["soft-power", "diplomatie-culturelle"], "diplomatie-culturelle": ["soft-power", "rayonnement"],
  universalisme: ["musee-universel"], "musee-universel": ["universalisme"], "la-haye": ["bouclier-bleu"], "bouclier-bleu": ["la-haye"],
  "patrimoine-mondial": ["convention-1972", "vue"], "convention-1972": ["patrimoine-mondial"], vue: ["patrimoine-mondial"], classement: ["monument-historique"], "monument-historique": ["classement"],
  patrimoine: ["patrimonialisation"], patrimonialisation: ["patrimoine"], immateriel: ["convention-2003"], "convention-2003": ["immateriel"], "crime-guerre": ["cpi"], cpi: ["crime-guerre"] };
const near = id => [id].concat(AVOID[id] || [], (GBY[id] && GBY[id].rel) || []);
const overlap = (a, b) => a.y <= (b.y2 || b.y) && b.y <= (a.y2 || a.y);

function mat(q) {
  const m = Object.assign({}, q);
  if (q.gen === "defA" || q.gen === "defB") {
    const t = GBY[q.term];
    const no = [t.id].concat(AVOID[t.id] || []);
    let d = pick(GLOSS.filter(g => no.indexOf(g.id) < 0 && g.c === t.c), 3);
    if (d.length < 3) d = d.concat(pick(GLOSS.filter(g => no.indexOf(g.id) < 0 && d.indexOf(g) < 0), 3 - d.length));
    if (q.gen === "defA") { m.q = "Quelle notion correspond à cette définition ?"; m.quote = t.d; m.o = [t.n].concat(d.map(x => x.n)); }
    else { m.q = "Quelle est la bonne définition de : " + t.n + " ?"; m.o = [t.d].concat(d.map(x => x.d)); }
    m.a = 0; m.e = t.n + " : " + t.d + (t.ex ? " Exemple : " + t.ex : ""); m.term = t.id;
  }
  if (q.gen === "dateA") {
    const e = EBY[q.ev]; const ds = []; shuffle(EVENTS).forEach(x => { if (x.d !== e.d && ds.indexOf(x.d) < 0 && ds.length < 3) ds.push(x.d); });
    m.q = "Quelle est la date de cet événement : " + e.t + " ?"; m.o = [e.d].concat(ds); m.a = 0; m.e = e.t + " : " + e.d + ". " + e.i;
  }
  if (q.gen === "dateB") {
    const e = EBY[q.ev]; const ts = pick(EVENTS.filter(x => x.id !== e.id && !overlap(x, e)), 3).map(x => x.t);
    m.q = "Quel événement correspond à la date " + e.d + " ?"; m.o = [e.t].concat(ts); m.a = 0; m.e = e.d + " : " + e.t + ". " + e.x;
  }
  if (q.gen === "exA") {
    const e = EBY[q.ev]; const good = GBY[e.n[0]];
    const no = []; e.n.forEach(n => near(n).forEach(x => no.push(x)));
    const bad = pick(GLOSS.filter(g => no.indexOf(g.id) < 0 && g.id !== "patrimoine" && g.id !== "patrimonialisation"), 3);
    m.q = "Quelle notion l'événement « " + e.t + " » (" + e.d + ") permet-il d'illustrer ?"; m.o = [good.n].concat(bad.map(x => x.n)); m.a = 0;
    m.e = e.i + " Notions liées : " + e.n.map(n => GBY[n].n).join(", ") + ".";
  }
  if (q.gen === "distA") {
    const d = DIST.find(x => x.id === q.dist); const it = d.items[q.idx];
    m.q = it[0]; m.sub = "Cette situation relève plutôt de :"; m.o = [d.a.t, d.b.t]; m.a = it[1] === "a" ? 0 : 1; m.keep = true;
    m.e = it[2] + " Critère : " + d.key;
  }
  if (m.t === "mcq") { const idx = m.keep ? m.o.map((_, i) => i) : shuffle(m.o.map((_, i) => i)); m.opts = idx.map(i => ({ t: m.o[i], ok: i === m.a })); }
  if (m.t === "match") m.rights = shuffle(m.p.map(x => x[1]));
  if (m.t === "order") { let o = shuffle(m.it); if (o.every((x, i) => x === m.it[i])) o = o.slice().reverse(); m.cur = o; }
  return m;
}

/* ================= progression ================= */
function prog() {
  const read = SECS.filter(s => S.read[s.id]).length;
  const gl = GLOSS.filter(g => S.gloss[g.id]).length;
  let cd = 0, cm = 0, cr = 0, cc = 0;
  CARDS.forEach(c => { const st = S.cards[c.id]; if (st === "maitrise") { cd += 1; cm++; } else if (st === "cours") { cd += .5; cc++; } else if (st === "revoir") cr++; });
  const qv = QCATS.map(c => (S.quiz[c.id] && S.quiz[c.id].best) || 0);
  const quizP = Math.round(qv.reduce((a, b) => a + b, 0) / QCATS.length);
  const parts = { read: pct(read, SECS.length), gloss: pct(gl, GLOSS.length), cards: pct(cd, CARDS.length), quiz: quizP };
  return { read, gl, cm, cr, cc, parts, global: Math.round((parts.read + parts.gloss + parts.cards + parts.quiz) / 4) };
}
function updateRail() {
  const p = prog();
  $("#railBar").style.width = p.global + "%";
  $("#railTxt").textContent = p.global + " % du chapitre maîtrisé";
  $("#nG").textContent = p.gl + "/" + GLOSS.length;
  $("#nF").textContent = p.cm + "/" + CARDS.length;
  $("#nQ").textContent = QCATS.filter(c => S.quiz[c.id]).length + "/" + QCATS.length;
  $("#nE").textContent = EVENTS.length;
  $("#nD").textContent = DIST.length;
}

  view.innerHTML = `<div class="wrap">

/* ================= QUIZ ================= */
let QS = null;
const TLAB = { mcq: "QCM", tf: "Vrai ou faux", short: "Réponse courte", match: "Association", order: "Classement chronologique" };
function startQuiz(kind, ids) {
  let list;
  if (ids) list = ids.map(id => QBY[id]).filter(Boolean);
  else if (kind === "mix") { list = []; QCATS.forEach(c => { const pool = ALLQ.filter(q => q.c === c.id); list = list.concat(pick(pool.filter(q => !q.gen), 2), pick(pool.filter(q => q.gen), 1)); }); list = shuffle(list.concat(pick(ALLQ.filter(q => list.indexOf(q) < 0), 20 - list.length))); }
  else if (kind === "err") list = pick(Object.keys(S.qs).filter(id => S.qs[id].last === 0 && QBY[id]).map(id => QBY[id]), 15);
  else {
    const pool = ALLQ.filter(q => q.c === kind), hand = pool.filter(q => !q.gen), gen = pool.filter(q => q.gen);
    const h = pick(hand, Math.min(hand.length, 6)); list = h.concat(pick(gen, 10 - h.length));
    if (list.length < 10) list = list.concat(pick(hand.filter(q => list.indexOf(q) < 0), 10 - list.length));
    list = shuffle(list);
  }
  if (!list.length) { toast("Aucune question à refaire"); if (QS) rQuiz(); else quizMenu(); return; }
  const lab = kind === "mix" ? "Examen blanc" : kind === "err" ? "Mes erreurs" : kind === "retry" ? "Erreurs de la série" : QCATS.find(c => c.id === kind).n;
  QS = { kind, lab, list: list.map(mat), i: 0 };
  rQuiz(); window.scrollTo(0, 0);
}
function rQuiz() {
  if (PEND) { const s = PEND.start; PEND = null; if (s) { startQuiz(s); return; } }
  if (!QS) return quizMenu();
  if (QS.i >= QS.list.length) return quizEnd();

  if (m.t === "tf") body = `<div class="tf">${[true, false].map(v => `<button class="opt${done ? (v === m.a ? " good" : (m.user === v ? " bad" : "")) : ""}" data-tf="${v}"${done ? " disabled" : ""}>${v ? "Vrai" : "Faux"}</button>`).join("")}</div>`;
  if (m.t === "short") body = `<div class="short-answer"><input type="text" id="sa" aria-label="Ta réponse" autocomplete="off" placeholder="Ta réponse…" value="${esc(m.user || "")}"${done ? " disabled" : ""} style="${done ? `border-color:${m.ok ? "var(--ok)" : "var(--ko)"}` : ""}">${done ? "" : `<button class="btn primary" id="qval">Valider</button>`}</div>`;
  if (m.t === "match") body = `<div>${m.p.map((pr, i) => {
    const u = done ? m.user[i] : ""; const ok = done && u === pr[1];
    return `<div class="mrow${done ? (ok ? " good" : " bad") : ""}"><span>${esc(pr[0])}</span><select data-m="${i}"${done ? " disabled" : ""} aria-label="${esc(pr[0])}"><option value="">Choisir…</option>${m.rights.map(r => `<option${u === r ? " selected" : ""}>${esc(r)}</option>`).join("")}</select>${done && !ok ? `<span class="fix">→ ${esc(pr[1])}</span>` : ""}</div>`;
  }).join("")}</div>${done ? "" : `<button class="btn primary" id="qval" style="align-self:flex-start">Valider</button>`}`;
  if (m.t === "order") body = `${done ? "" : `<p class="count">Glisse la poignée pour déplacer un élément, ou utilise les flèches.</p>`}<div class="olist">${m.cur.map((it, i) => `<div class="oitem${done ? (it === m.it[i] ? " good" : " bad") : " draggable-order"}" data-order-index="${i}">${done ? "" : `<span class="drag-handle" data-drag-handle aria-hidden="true" title="Glisser pour déplacer">⠿</span>`}<span class="n">${i + 1}</span><span>${esc(it)}</span>${done ? (it === m.it[i] ? "" : `<span class="count">→ ${m.it.indexOf(it) + 1}</span>`) : `<span class="mv"><button data-up="${i}" aria-label="Monter"${i === 0 ? " disabled" : ""}>↑</button><button data-dn="${i}" aria-label="Descendre"${i === m.cur.length - 1 ? " disabled" : ""}>↓</button></span>`}</div>`).join("")}</div>${done ? "" : `<button class="btn primary" id="qval" style="align-self:flex-start">Valider l'ordre</button>`}`;

  let fb = "";
  if (done) {
    let right = "";

    if (m.t === "tf" && !m.ok) right = "Bonne réponse : " + (m.a ? "Vrai" : "Faux");
    if (m.t === "short") right = (m.ok ? "Réponse attendue : " : "Il fallait répondre : ") + m.s;

    <div class="row"><button class="btn primary" id="qnext">${QS.i < QS.list.length - 1 ? "Question suivante →" : "Voir le bilan"}</button><span class="count">ou Entrée</span></div>`;

    <span class="qtype">${TLAB[m.t]}${m.gen ? "" : " · " + esc((QCATS.find(c => c.id === m.c) || {}).n || "")}</span>

    ${m.sub ? `<p class="mute">${esc(m.sub)}</p>` : ""}
    ${body}${fb}
  </div></div>`;
  if (m.t === "order" && !done) bindOrderDrag(view, m, rQuiz);
  view.onclick = e => {
    if (e.target.closest("#qquit")) { QS = null; rQuiz(); return; }
    if (e.target.closest("#qnext")) { QS.i++; rQuiz(); window.scrollTo(0, 0); return; }
    if (done) return;
    const o = e.target.closest("[data-o]"); if (o) { const i = +o.dataset.o; answer(m, m.opts[i].ok, i); return; }

  <div class="blk"><h3>Réflexes pour une bonne copie</h3><ul>

  <li>Utiliser les distinctions du chapitre : restauration ≠ réhabilitation ≠ rénovation, monument historique ≠ patrimoine mondial, restitution ≠ prêt.</li>
  <li>Varier les échelles et les acteurs : habitants, villes, États, UNESCO, ONG, groupes armés, CPI.</li>
  <li>Croiser les deux axes : le même lieu peut être à la fois un outil politique et un patrimoine menacé (Versailles et le surtourisme).</li>
  <li>Nuancer : le label UNESCO protège mais attire aussi des foules ; protéger un quartier peut le gentrifier.</li>
  <li>Ne pas reprendre de citation douteuse (« L'État, c'est moi ») ni de chiffre non vérifié.</li></ul></div>`;
